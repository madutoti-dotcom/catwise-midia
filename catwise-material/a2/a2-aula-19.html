<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: notice mistakes</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Find the mistake</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Correct the sentences</h3><p style="font-size:29px;line-height:1.35">1. I goed to the beach yesterday.</p><p style="font-size:29px;line-height:1.35">2. She is more tall than her brother.</p><p style="font-size:29px;line-height:1.35">3. I was sleep when you called.</p><p style="font-size:29px;line-height:1.35">4. We don’t have some milk.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:29px;line-height:1.35">5. I think it will to rain.</p><p style="font-size:29px;line-height:1.35">6. How many money do you have?</p><p style="font-size:29px;line-height:1.35">7. Did you went to the party?</p><p style="font-size:29px;line-height:1.35">8. It’s the most cheap shop.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 19 · Review Time I · 2/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ &amp; FIND</p><p style="font-size:28px;color:#955E14">Goal: find grammar in a story</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">The worst trip ever</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:26px;line-height:1.35">Last year, I <b>went</b> to Bariloche with my sister. It <b>was</b> colder than Curitiba and there <b>wasn’t any</b> snow! On the second day, while we <b>were walking</b> by the lake, my sister <b>lost</b> her phone.</p><p style="font-size:26px;line-height:1.35">We <b>didn’t have much</b> money, so we <b>ate</b> sandwiches every day. The hotel was the smallest and the noisiest in the city.</p><p style="font-size:26px;line-height:1.35">But next year we<b>’re going to</b> go again. I think it <b>will</b> be better. It <b>might</b> even snow!</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Find</h3><p style="font-size:28px;line-height:1.35">1. 3 verbs in the past simple</p><p style="font-size:28px;line-height:1.35">2. 1 past continuous</p><p style="font-size:28px;line-height:1.35">3. 1 comparative and 2 superlatives</p><p style="font-size:28px;line-height:1.35">4. 2 quantity words</p><p style="font-size:28px;line-height:1.35">5. 3 ways to talk about the future</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 19 · text written by CatWise · 3/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="auction" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GAME</p><p style="font-size:28px;color:#955E14">Goal: decide: correct or not?</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Grammar auction</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">You have R$ 1,000. Bet on correct sentences!</h3><p style="font-size:27px;line-height:1.35">1. I was cooking when the phone rang.</p><p style="font-size:27px;line-height:1.35">2. My city is more big than yours.</p><p style="font-size:27px;line-height:1.35">3. There aren’t many people here.</p><p style="font-size:27px;line-height:1.35">4. I’m going to visit my aunt tomorrow.</p><p style="font-size:27px;line-height:1.35">5. Can I have a bread, please?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:27px;line-height:1.35">6. She didn’t saw the film.</p><p style="font-size:27px;line-height:1.35">7. It might rain later.</p><p style="font-size:27px;line-height:1.35">8. This is the best pizza in town.</p><p style="font-size:27px;line-height:1.35">9. We bought a few eggs and a little milk.</p><p style="font-size:27px;line-height:1.35">10. While I walked, I was seeing a cat.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Win: double your bet. Lose: lose it.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 19 · Review Time I · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: choose the right form</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Mixed practice</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Past simple or past continuous?</h3><p style="font-size:27px;line-height:1.35">1. I ___ (watch) TV when you ___ (call).</p><p style="font-size:27px;line-height:1.35">2. Yesterday we ___ (go) to the market.</p><p style="font-size:27px;line-height:1.35">3. What ___ you ___ (do) at 8 last night?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete</h3><p style="font-size:27px;line-height:1.35">1. São Paulo is ___ (big) than Rio.</p><p style="font-size:27px;line-height:1.35">2. I think Brazil ___ win. (prediction)</p><p style="font-size:27px;line-height:1.35">3. I have ___ friends here. (a few / a little)</p><p style="font-size:27px;line-height:1.35">4. I’m not sure. I ___ go to the party.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Additional exercises (end of the book): choose the exercises on the past and on the future. Confira os números no livro.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Additional exercises · 5/7</p>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="picture" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: tell a story with many tenses</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Picture Prompt</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Choose a photo</h3><p style="font-size:28px;line-height:1.35">Your teacher shows a photo (a beach, a party, a rainy street…).</p><p style="font-size:28px;line-height:1.35">Tell the story:</p><p style="font-size:27px;line-height:1.35">1. What happened? (past simple)</p><p style="font-size:27px;line-height:1.35">2. What were people doing? (past continuous)</p><p style="font-size:27px;line-height:1.35">3. What will happen next? (will / might / going to)</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Useful words</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">first</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">then</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">while</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">when</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">suddenly</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">in the end</p></div><p style="font-size:25px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">It was a sunny day. People were swimming when suddenly…</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then write 5 sentences of your story.</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: talk about plans and weather</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What’s the weather like?</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What’s the weather like today?</p><p style="font-size:36px;line-height:1.35">2. What are you going to do this weekend?</p><p style="font-size:36px;line-height:1.35">3. What’s your favourite season? Why?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Weather words</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">sunny</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">cloudy</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">rainy</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">windy</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">hot</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">cold</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">a storm</p></div><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">It’s sunny today. I’m going to go to the beach!</p></div></div>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="listen" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LISTEN &amp; COMPLETE</p><p style="font-size:28px;color:#955E14">Goal: understand a weather forecast</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Today’s weather</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening/weather-forecast"><span style="color:#FBF1E1">Listen on British Council ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4A3B2A">A presenter gives today’s weather in four parts of the country. Listen and complete.</p><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Where?</h3><p style="font-size:28px;line-height:1.35">1. Where will it be very windy and cold? Take an umbrella!</p><p style="font-size:28px;line-height:1.35">2. Where will it rain all day? Maybe a thunderstorm.</p><p style="font-size:28px;line-height:1.35">3. Where will it be dry, but cloudy and windy?</p><p style="font-size:28px;line-height:1.35">4. Where will it be sunny in the afternoon?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Temperatures</h3><p style="font-size:30px;line-height:1.35">North: ___ °C</p><p style="font-size:30px;line-height:1.35">East: ___ °C</p><p style="font-size:30px;line-height:1.35">West and middle: ___ °C</p><p style="font-size:30px;line-height:1.35">South: ___ °C</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Audio: British Council LearnEnglish Teens, “Weather forecast” (A2) · link only · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 28 &amp; 30</p><p style="font-size:28px;color:#955E14">Goal: say how sure you are</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">will · might · won’t</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Sure: will</h3><p style="font-size:30px;line-height:1.35">It <b>will</b> be sunny tomorrow.</p><p style="font-size:30px;line-height:1.35">It <b>will</b> rain all day.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">100%</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Not sure: might</h3><p style="font-size:30px;line-height:1.35">It <b>might</b> rain later.</p><p style="font-size:30px;line-height:1.35">There <b>might</b> be a storm.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">50% · might + verb (no “to”)</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Sure, negative: won’t</h3><p style="font-size:30px;line-height:1.35">It <b>won’t</b> snow in Rio!</p><p style="font-size:30px;line-height:1.35">It <b>might not</b> be hot.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">0%</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Weather words: rain → <b>rainy</b> · sun → <b>sunny</b> · wind → <b>windy</b> · cloud → <b>cloudy</b> · fog → <b>foggy</b></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 28 and 30 · 4/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. will, might or won’t?</h3><p style="font-size:29px;line-height:1.35">1. Take an umbrella. It ___ rain. (50%)</p><p style="font-size:29px;line-height:1.35">2. It’s August in Salvador. It ___ snow!</p><p style="font-size:29px;line-height:1.35">3. Look at those black clouds. It ___ rain soon. (100%)</p><p style="font-size:29px;line-height:1.35">4. I ___ go to the beach. I’m not sure.</p><p style="font-size:29px;line-height:1.35">5. The forecast says it ___ be 35 °C tomorrow.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete with a weather word</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">sunny</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">windy</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">foggy</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">cloudy</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">rainy</p></div><p style="font-size:29px;line-height:1.35">1. I can’t see the road. It’s very ___.</p><p style="font-size:29px;line-height:1.35">2. Wear sunscreen. It’s ___.</p><p style="font-size:29px;line-height:1.35">3. My umbrella broke. It’s really ___.</p><p style="font-size:29px;line-height:1.35">4. There’s no sun, but no rain: it’s ___.</p><p style="font-size:29px;line-height:1.35">5. Stay home. It’s cold and ___.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 30 (might): Exercise 30.1. In class if we have time, or at home.</p></div>

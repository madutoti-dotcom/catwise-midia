<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: talk about the future</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Your future</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What are you doing next weekend?</p><p style="font-size:36px;line-height:1.35">2. What are you going to do next year?</p><p style="font-size:36px;line-height:1.35">3. Where do you think you’ll be in 10 years?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Remember</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I’m meeting… (arrangement)</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I’m going to… (plan)</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I think I’ll… / I might… (prediction)</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ THE MODEL</p><p style="font-size:28px;color:#955E14">Goal: see how Lia talks about the future</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Looking ahead</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:26px;line-height:1.35">Next month I<b>’m visiting</b> three places for my restaurant. Next year I<b>’m going to</b> open it in Pinheiros. It<b>’s going to</b> have food from Belém and Italy.</p><p style="font-size:26px;line-height:1.35">I think it <b>will</b> be hard, but I <b>won’t</b> give up. I <b>might</b> go to Italy first to learn more. And one day, I<b>’d like to</b> write a cookbook with my grandmother’s recipes.</p><p style="font-size:26px;line-height:1.35">Thank you! Do you have any questions?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Answer</h3><p style="font-size:27px;line-height:1.35">1. What is Lia doing next month?</p><p style="font-size:27px;line-height:1.35">2. What is her plan for next year?</p><p style="font-size:27px;line-height:1.35">3. What is she not sure about?</p><p style="font-size:27px;line-height:1.35">4. How does she end the talk?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 24 · model text written by CatWise · 3/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#955E14">Goal: talk about plans and end well</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Tools for the future</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Sure</h3><p style="font-size:27px;line-height:1.35">I<b>’m starting</b> a course in March.</p><p style="font-size:27px;line-height:1.35">I<b>’m going to</b> move.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Not sure / dreams</h3><p style="font-size:27px;line-height:1.35">I think I<b>’ll</b>…</p><p style="font-size:27px;line-height:1.35">I <b>might</b>…</p><p style="font-size:27px;line-height:1.35">One day, I<b>’d like to</b>…</p><p style="font-size:27px;line-height:1.35">My dream <b>is to</b>…</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">End your talk</h3><p style="font-size:27px;line-height:1.35"><b>To sum up</b>, …</p><p style="font-size:27px;line-height:1.35"><b>Thank you for listening!</b></p><p style="font-size:27px;line-height:1.35">Do you have any questions?</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Check <p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 24 · My Life Story · Future · 5/7</p>

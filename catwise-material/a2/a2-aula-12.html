<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 15 &amp; 17</p><p style="font-size:28px;color:#955E14">Goal: talk about experiences</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Have you ever been to…?</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Form</h3><p style="font-size:28px;line-height:1.35">I / you / we / they <b>have</b> + participle</p><p style="font-size:28px;line-height:1.35">he / she <b>has</b> + participle</p><p style="font-size:28px;line-height:1.35">I<b>’ve</b> been · she<b>’s</b> eaten</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">ever / never</h3><p style="font-size:28px;line-height:1.35"><b>Have</b> you <b>ever</b> eaten sushi?</p><p style="font-size:28px;line-height:1.35">Yes, I <b>have</b>. / No, I <b>haven’t</b>.</p><p style="font-size:28px;line-height:1.35">I’ve <b>never</b> seen snow.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Participles</h3><p style="font-size:28px;line-height:1.35">be → <b>been</b> · see → <b>seen</b></p><p style="font-size:28px;line-height:1.35">eat → <b>eaten</b> · do → <b>done</b></p><p style="font-size:28px;line-height:1.35">meet → <b>met</b> · have → <b>had</b></p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">No time: Have you ever…? · When? → past simple: “Yes, I went there <b>in 2019</b>.” (next class!)</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 15 and 17 · 4/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Write the question and answer</h3><p style="font-size:24px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. you / eat sushi? (✓) → Have you ever eaten sushi? Yes, I have.</p><p style="font-size:28px;line-height:1.35">1. she / be / to Argentina? (✗)</p><p style="font-size:28px;line-height:1.35">2. you / meet / a famous person? (✓)</p><p style="font-size:28px;line-height:1.35">3. they / see / snow? (✗)</p><p style="font-size:28px;line-height:1.35">4. your father / drive / a truck? (✓)</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">been</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">never</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">has</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">ever</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">seen</p></div><p style="font-size:28px;line-height:1.35">1. My grandma ___ lived in three countries.</p><p style="font-size:28px;line-height:1.35">2. I’ve ___ flown in a helicopter.</p><p style="font-size:28px;line-height:1.35">3. Have you ___ been to Bahia?</p><p style="font-size:28px;line-height:1.35">4. We’ve ___ that film three times!</p><p style="font-size:28px;line-height:1.35">5. He’s never ___ to a concert.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 17 (Have you ever…?): Exercise 17.1. In class if we have time, or at home.</p></div>

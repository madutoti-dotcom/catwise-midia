<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: compare places to shop</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Market or supermarket?</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. Where do you usually buy food?</p><p style="font-size:36px;line-height:1.35">2. Which is cheaper: the market or the supermarket?</p><p style="font-size:36px;line-height:1.35">3. What is the best shop in your city?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">The market is cheaper than the supermarket.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">But the supermarket is more comfortable.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">The best shop in my city is a small bakery.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Use: cheaper · busier · more expensive · the best</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 6 · At the Shops · 2/7</p>

</section>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="listen" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LISTEN &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: understand a conversation in a shop</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Shopping for clothes</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglish.britishcouncil.org/free-resources/listening/a1/shopping-clothes"><span style="color:#FBF1E1">Listen on British Council ↗</span></a></p></div><p style="font-size:32px;line-height:1.35;color:#4A3B2A">A customer is in a clothes shop. Listen and answer.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Questions</h3><p style="font-size:32px;line-height:1.35">1. What does the customer want?</p><p style="font-size:32px;line-height:1.35">2. Which colour and size?</p><p style="font-size:32px;line-height:1.35">3. How much is it?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:32px;line-height:1.35">4. How does the customer pay?</p><p style="font-size:32px;line-height:1.35">5. What does the assistant offer at the end?</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Then find: “I’m just looking” · “How much is this?”</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Audio: British Council LearnEnglish, “Shopping for clothes” (A1) · link only · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 75 &amp; 82</p><p style="font-size:28px;color:#955E14">Goal: talk about quantities</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">some · any · much · many</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">some / any</h3><p style="font-size:30px;line-height:1.35">I need <b>some</b> bread.</p><p style="font-size:30px;line-height:1.35">We don’t have <b>any</b> milk.</p><p style="font-size:30px;line-height:1.35">Do you have <b>any</b> eggs?</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Offer: Would you like <b>some</b> coffee?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">many / much</h3><p style="font-size:30px;line-height:1.35"><b>many</b> + countable: many shops</p><p style="font-size:30px;line-height:1.35"><b>much</b> + uncountable: much money</p><p style="font-size:30px;line-height:1.35">Positive: <b>a lot of</b> people</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Ask the price</h3><p style="font-size:30px;line-height:1.35"><b>How much</b> is this jumper?</p><p style="font-size:30px;line-height:1.35"><b>How much</b> are these shoes?</p><p style="font-size:30px;line-height:1.35"><b>How many</b> bags do you need?</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Not much / not many in negatives: I don’t have <b>much</b> time. · There aren’t <b>many</b> people today.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 75 and 82 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. some or any?</h3><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. I’d like ___ water. → some</p><p style="font-size:30px;line-height:1.35">1. Are there ___ apples?</p><p style="font-size:30px;line-height:1.35">2. I don’t have ___ cash.</p><p style="font-size:30px;line-height:1.35">3. Can I have ___ bags, please?</p><p style="font-size:30px;line-height:1.35">4. We need ___ rice.</p><p style="font-size:30px;line-height:1.35">5. Is there ___ coffee?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. much, many, How much or How many?</h3><p style="font-size:30px;line-height:1.35">1. I don’t have ___ money.</p><p style="font-size:30px;line-height:1.35">2. ___ is this T-shirt?</p><p style="font-size:30px;line-height:1.35">3. There aren’t ___ people here.</p><p style="font-size:30px;line-height:1.35">4. ___ eggs do you need?</p><p style="font-size:30px;line-height:1.35">5. How ___ time do we have?</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 82 (a lot / much / many): Exercise 82.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 82 · 5/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: buy things and ask prices</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Role-play: at the shop</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Shop assistant (price list)</h3><p style="font-size:30px;line-height:1.35">T-shirt R$ 59 · jeans R$ 149</p><p style="font-size:30px;line-height:1.35">trainers R$ 299 · socks R$ 25</p><p style="font-size:30px;line-height:1.35">Sizes: S, M, L · Colours: black, blue, white</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">“Can I help you?” · “What size do you need?”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Customer</h3><p style="font-size:30px;line-height:1.35">Buy 3 things for a weekend trip.</p><p style="font-size:30px;line-height:1.35">Ask: colour, size, price.</p><p style="font-size:30px;line-height:1.35">You have R$ 400. Is it enough?</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">How much is…? · Do you have any…? · I’ll take it.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 6 · At the Shops · 6/7</p>

<figure class="sl" aria-label="Slide 2 de 7"><div class="fr"><section data-id="warmup" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: remember quantities</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What did you buy last week?</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What did you buy at the supermarket last week?</p><p style="font-size:36px;line-height:1.35">2. Did you buy any fruit?</p><p style="font-size:36px;line-height:1.35">3. How much money did you spend?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I bought some bread and a lot of bananas.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I didn’t buy any meat.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I didn’t spend much money.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 7 · Food Habits · 2/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ &amp; DECIDE</p><p style="font-size:28px;color:#955E14">Goal: understand people’s eating habits</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">What’s in your fridge?</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:27px;line-height:1.35"><b>Rita, 34:</b> “I work a lot, so I eat <b>a lot of</b> sandwiches. In my fridge there’s <b>a bottle of</b> water, <b>some</b> cheese and <b>a few</b> eggs. There isn’t <b>any</b> fruit!”</p><p style="font-size:27px;line-height:1.35"><b>Jorge, 58:</b> “I cook every day. I buy <b>a little</b> meat and <b>a lot of</b> vegetables at the market. I drink <b>a cup of</b> coffee in the morning, only one.”</p><p style="font-size:27px;line-height:1.35"><b>Lena, 22:</b> “I’m a student. I eat <b>a bowl of</b> cereal for breakfast and I drink <b>too much</b> soda. I want to change that.”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">True or false?</h3><p style="font-size:28px;line-height:1.35">1. Rita has some fruit in her fridge.</p><p style="font-size:28px;line-height:1.35">2. Jorge cooks every day.</p><p style="font-size:28px;line-height:1.35">3. Jorge drinks a lot of coffee.</p><p style="font-size:28px;line-height:1.35">4. Lena eats cereal for breakfast.</p><p style="font-size:28px;line-height:1.35">5. Who has the healthiest habits? Why?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 7 · text written by CatWise · 3/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 66–67 &amp; 83</p><p style="font-size:28px;color:#955E14">Goal: count food and drinks</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">an egg · some rice · a bottle of water</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Countable</h3><p style="font-size:30px;line-height:1.35">an apple → two apples</p><p style="font-size:30px;line-height:1.35">an egg → a few eggs</p><p style="font-size:30px;line-height:1.35">How <b>many</b> eggs?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Uncountable</h3><p style="font-size:30px;line-height:1.35">rice · bread · milk · cheese · money</p><p style="font-size:30px;line-height:1.35"><b>a little</b> milk</p><p style="font-size:30px;line-height:1.35">How <b>much</b> rice?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Count it!</h3><p style="font-size:28px;line-height:1.35">a <b>bottle</b> of water · a <b>cup</b> of coffee</p><p style="font-size:28px;line-height:1.35">a <b>loaf</b> of bread · a <b>box</b> of cereal</p><p style="font-size:28px;line-height:1.35">a <b>bag</b> of rice · a <b>jar</b> of jam</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Never: “a bread”, “two milks”, “breads” → <b>some bread</b>, <b>two bottles of milk</b></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 66, 67 and 83 · 4/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Countable (C) or uncountable (U)?</h3><p style="font-size:30px;line-height:1.35">1. banana · 2. sugar · 3. bread</p><p style="font-size:30px;line-height:1.35">4. tomato · 5. water · 6. cookie</p><p style="font-size:30px;line-height:1.35">7. cheese · 8. potato · 9. coffee</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">bottle</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">loaf</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">a few</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">a little</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">many</p></div><p style="font-size:29px;line-height:1.35">1. Can I have a ___ of water?</p><p style="font-size:29px;line-height:1.35">2. I need a ___ of bread.</p><p style="font-size:29px;line-height:1.35">3. Put ___ sugar in my coffee, please.</p><p style="font-size:29px;line-height:1.35">4. I have ___ friends in Rio.</p><p style="font-size:29px;line-height:1.35">5. How ___ oranges do you want?</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 66 (countable/uncountable 1): Exercise 66.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 66 · 5/7</p>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="game" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: talk about food fast</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Category Game</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Category Game (60 seconds)</h3><p style="font-size:30px;line-height:1.35">Your teacher says a category.</p><p style="font-size:30px;line-height:1.35">You say as many foods as you can.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">fruit</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">drinks</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">breakfast</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">Brazilian food</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">in a jar</p></div><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then say: countable or uncountable?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Interview: your eating habits</h3><p style="font-size:29px;line-height:1.35">What do you have for breakfast?</p><p style="font-size:29px;line-height:1.35">How much water do you drink a day?</p><p style="font-size:29px;line-height:1.35">How many cups of coffee?</p><p style="font-size:29px;line-height:1.35">What do you eat too much?</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I have a bowl of… · I drink a little… · I eat a lot of…</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 7 · Food Habits · 6/7</p>

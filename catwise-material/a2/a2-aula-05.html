<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: remember the past tenses</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">My city ten years ago</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Talk about you</h3><p style="font-size:36px;line-height:1.35">Ten years ago, I was living in ______.</p><p style="font-size:36px;line-height:1.35">I was working / studying ______.</p><p style="font-size:36px;line-height:1.35">My city had ______. It didn’t have ______.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Ten years ago, I was living in Sorocaba.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I was studying at night.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">My street didn’t have a bakery. Now it has two!</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 5 · My City · 2/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="watch" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: hear comparisons</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">The greatest vacation of all time</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learningenglish.voanews.com/a/lets-learn-english-level-2-lesson-5-greatest-vacation/4035571.html"><span style="color:#FBF1E1">Watch the video ↗</span></a></p></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:40px;line-height:1.35">1. Where is Anna?</p><p style="font-size:36px;line-height:1.35">a) at a travel agency<br>b) at the airport<br>c) at a hotel</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:40px;line-height:1.35">2. Why doesn’t she want the first two trips?</p><p style="font-size:36px;line-height:1.35">a) She is afraid of heights and sharks.<br>b) They are too far.<br>c) She has no time.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:40px;line-height:1.35">3. What happens to the Travel Max 2000?</p><p style="font-size:36px;line-height:1.35">a) Anna buys it.<br>b) It catches fire.<br>c) Dan sells it.</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Listen for: “It is <span style="color:#955E14">pricier than</span> the Mountain Getaway.” · “It is our <span style="color:#955E14">priciest</span> vacation.”</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Video: VOA Learning English, Let’s Learn English Level 2, Lesson 5 · learningenglish.voanews.com · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 86–89</p><p style="font-size:28px;color:#955E14">Goal: compare places</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">bigger · more expensive · the best</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Short: -er / the -est</h3><p style="font-size:30px;line-height:1.35">cheap → cheaper → the cheapest</p><p style="font-size:30px;line-height:1.35">big → bigger → the biggest</p><p style="font-size:30px;line-height:1.35">busy → busier → the busiest</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Long: more / the most</h3><p style="font-size:30px;line-height:1.35">expensive → more expensive</p><p style="font-size:30px;line-height:1.35">→ the most expensive</p><p style="font-size:30px;line-height:1.35">modern → more modern</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Irregular</h3><p style="font-size:30px;line-height:1.35">good → better → the best</p><p style="font-size:30px;line-height:1.35">bad → worse → the worst</p><p style="font-size:30px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">+ than: bigger than</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Not as … as: <span style="color:#955E14">Rio is not as cold as Curitiba.</span> · Say “than” fast: /ðən/</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 86–89 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:0.85fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Write the comparative</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. cheap → cheaper than</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px"><p style="font-size:29px;line-height:1.35">1. big → _____</p><p style="font-size:29px;line-height:1.35">4. good → _____</p><p style="font-size:29px;line-height:1.35">2. busy → _____</p><p style="font-size:29px;line-height:1.35">5. bad → _____</p><p style="font-size:29px;line-height:1.35">3. expensive → _____</p><p style="font-size:29px;line-height:1.35">6. modern → _____</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete with the superlative or as … as</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. This is ___ (old) building here. → the oldest</p><p style="font-size:31px;line-height:1.35">1. Sunday is ___ (quiet) day of the week.</p><p style="font-size:31px;line-height:1.35">2. That was ___ (good) pizza of my life.</p><p style="font-size:31px;line-height:1.35">3. The metro is ___ (fast) way to work.</p><p style="font-size:31px;line-height:1.35">4. January is ___ (expensive) month to travel.</p><p style="font-size:31px;line-height:1.35">5. Rio is not as ___ (cold) as Curitiba.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 87, first exercise · Unit 89, first exercise. Do it in class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises based on Essential Grammar in Use (R. Murphy, Cambridge), Units 86–89 · 5/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">DESCRIBE THE IMAGE</p><p style="font-size:28px;color:#955E14">Goal: compare then and now</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Your street: then and now</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://www.google.com/maps"><span style="color:#FBF1E1">Open Google Maps ↗</span></a></p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How to find it</h3><p style="font-size:36px;line-height:1.35">1. Open Street View on your street.</p><p style="font-size:36px;line-height:1.35">2. Click “See more dates”.</p><p style="font-size:36px;line-height:1.35">3. Choose an old photo (2011 or 2015).</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Compare</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">In 2011, the street was quieter.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Now it is busier and more modern.</p><p style="font-size:36px;line-height:1.35">The trees are bigger. The houses are…</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Use: was / were + -er · more · not as … as</p></div></div><p style="font-size:30px;line-height:1.35;color:#955E14">Which is better: then or now? Why?</p>

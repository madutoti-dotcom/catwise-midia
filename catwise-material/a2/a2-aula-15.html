<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: describe your neighbourhood</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Your neighbourhood</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What is there near your house?</p><p style="font-size:36px;line-height:1.35">2. Have you ever been lost in a city?</p><p style="font-size:36px;line-height:1.35">3. Do you walk faster or slower than your friends?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Places</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">bank</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">pharmacy</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">library</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">bakery</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">hospital</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">bus stop</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">traffic lights</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">roundabout</p></div><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">There’s a pharmacy near my house.</p></div></div>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="listen" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LISTEN &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: follow directions</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Giving directions</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening/giving-directions"><span style="color:#FBF1E1">Listen on British Council ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4A3B2A">Four people ask for directions. Listen and answer.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Where is it?</h3><p style="font-size:28px;line-height:1.35">A. Turn first left onto ______ Street. It’s next to the ______.</p><p style="font-size:28px;line-height:1.35">B. Go past the ______. It’s on the ______, next to a shop.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:28px;line-height:1.35">C. Turn left at the ______. It’s opposite the ______.</p><p style="font-size:28px;line-height:1.35">D. Take the second right onto ______ Road. It’s opposite the ______.</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Write 3 direction phrases you hear.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Audio: British Council LearnEnglish Teens, “Giving directions” (A2) · link only · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 102–103</p><p style="font-size:28px;color:#955E14">Goal: give clear directions</p></div><h2 style="font-size:54px;font-weight:400;line-height:1.1">Go past the bank. It’s opposite the café.</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Place</h3><p style="font-size:28px;line-height:1.35"><b>next to</b> · <b>opposite</b></p><p style="font-size:28px;line-height:1.35"><b>between</b> A and B</p><p style="font-size:28px;line-height:1.35"><b>behind</b> · <b>in front of</b></p><p style="font-size:28px;line-height:1.35"><b>on the corner of</b></p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Movement</h3><p style="font-size:28px;line-height:1.35">go <b>along</b> the street</p><p style="font-size:28px;line-height:1.35">go <b>past</b> the bank</p><p style="font-size:28px;line-height:1.35">go <b>over</b> the bridge</p><p style="font-size:28px;line-height:1.35">go <b>through</b> the park</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Imperatives</h3><p style="font-size:28px;line-height:1.35"><b>Go</b> straight on.</p><p style="font-size:28px;line-height:1.35"><b>Turn</b> left. <b>Take</b> the 2nd right.</p><p style="font-size:28px;line-height:1.35"><b>Don’t turn</b> here.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Polite: Excuse me, how do I get to…?</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Ask: Excuse me, where’s the…? · How do I get to…? · Is it far? · Is there a… near here?</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 102–103 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Choose</h3><p style="font-size:27px;line-height:1.35">1. The bank is (between / opposite) the café and the hotel.</p><p style="font-size:27px;line-height:1.35">2. Walk (through / over) the park.</p><p style="font-size:27px;line-height:1.35">3. Go (past / next) the school.</p><p style="font-size:27px;line-height:1.35">4. The cat jumped (over / along) the wall.</p><p style="font-size:27px;line-height:1.35">5. The bus stop is (in front of / through) the bakery.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Put the directions in order</h3><p style="font-size:28px;line-height:1.35">a) Go past the church.</p><p style="font-size:28px;line-height:1.35">b) Excuse me, how do I get to the station?</p><p style="font-size:28px;line-height:1.35">c) It’s on your right, opposite the bank.</p><p style="font-size:28px;line-height:1.35">d) Turn left at the traffic lights.</p><p style="font-size:28px;line-height:1.35">e) Go straight on for two minutes.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 103 (up / over / through…): Exercise 103.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 103 · 5/7</p>

</section>

<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 4 · Leaving a Message · 2/7</p>

ze:30px;line-height:1.35">About: the ______ project</p><p style="font-size:30px;line-height:1.35">Phone: ____________</p><p style="font-size:30px;line-height:1.35">Email: ____________</p></div></div>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: useful phone phrases</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">On the phone</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Caller</h3><p style="font-size:30px;line-height:1.35">Hello, <b>this is</b> Peter Griffin.</p><p style="font-size:30px;line-height:1.35"><b>Can I speak to</b> Maria, please?</p><p style="font-size:30px;line-height:1.35">Could you ask her to <b>call me back</b>?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Receptionist</h3><p style="font-size:30px;line-height:1.35"><b>I’m afraid</b> she’s out of the office.</p><p style="font-size:30px;line-height:1.35">Can I <b>take a message</b>?</p><p style="font-size:30px;line-height:1.35">Could you spell that, please?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Check</h3><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Let me read that back.</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">So that’s 07460…</p><p style="font-size:30px;line-height:1.35">I’ll tell her you called.</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">On the phone: “<b>This is</b> Peter” (not “I am Peter”) · “<b>I’m afraid</b>…” = bad news, politely</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 4 · Leaving a Message · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: build a phone call</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. Put the call in order (1–6)</h3><p style="font-size:28px;line-height:1.35">__ Sure. It’s 0161 496 0537.</p><p style="font-size:28px;line-height:1.35">__ Hello, this is Laura Mendes. Can I speak to Mr. Hill?</p><p style="font-size:28px;line-height:1.35">__ Good morning, Hill &amp; Co.</p><p style="font-size:28px;line-height:1.35">__ I’m afraid he’s in a meeting. Can I take a message?</p><p style="font-size:28px;line-height:1.35">__ Let me read that back: 0161 496 0537.</p><p style="font-size:28px;line-height:1.35">__ Yes, please. Could you ask him to call me back?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Choose</h3><p style="font-size:28px;line-height:1.35">1. Hello, <b>I am / this is</b> Carla from Brightline.</p><p style="font-size:28px;line-height:1.35">2. <b>I’m afraid / I’m happy</b> she’s on holiday.</p><p style="font-size:28px;line-height:1.35">3. Can I <b>take / make</b> a message?</p><p style="font-size:28px;line-height:1.35">4. Could you ask him to call me <b>again / back</b>?</p><p style="font-size:28px;line-height:1.35">5. Let me <b>read / say</b> that back.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 8 “Office telephone conversation”: the dialogue. Your teacher shows the PDF.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise exercises · EXTRA: Business book (Materiais ESL), Unit 8 · 5/7</p>

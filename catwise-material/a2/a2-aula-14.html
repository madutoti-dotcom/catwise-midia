<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: talk about sports</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Sports and you</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. Have you ever played a team sport?</p><p style="font-size:36px;line-height:1.35">2. What sport do you like watching?</p><p style="font-size:36px;line-height:1.35">3. What did you do last weekend?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">play · go · do</h3><p style="font-size:28px;line-height:1.35"><b>play</b> football, tennis, volleyball</p><p style="font-size:28px;line-height:1.35"><b>go</b> swimming, running, cycling</p><p style="font-size:28px;line-height:1.35"><b>do</b> yoga, judo, exercise</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LISTEN &amp; COMPLETE</p><p style="font-size:28px;color:#955E14">Goal: understand information about a club</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Joining a club</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening/free-time"><span style="color:#FBF1E1">Listen on British Council ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4A3B2A">Tyrone calls a sports club. Listen and complete his notes.</p><div style="display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tyrone’s notes</h3><p style="font-size:29px;line-height:1.35">Sport: ________ · Age group: under-___</p><p style="font-size:29px;line-height:1.35">Pool: ________ pool</p><p style="font-size:29px;line-height:1.35">Training: ________ and ________, ___ to ___ pm</p><p style="font-size:29px;line-height:1.35">Matches: ________ mornings</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:29px;line-height:1.35">Start date: September ___</p><p style="font-size:29px;line-height:1.35">Price for under 18s: ________</p><p style="font-size:29px;line-height:1.35">He needs: a ________ and a ________</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Audio: British Council LearnEnglish Teens, “Free time” (A2) · link only · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 85–87</p><p style="font-size:28px;color:#955E14">Goal: say how people do things</p></div><h2 style="font-size:56px;font-weight:400;line-height:1.1">She swims fast. He swims faster.</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Adjective → adverb</h3><p style="font-size:28px;line-height:1.35">quick → quick<b>ly</b></p><p style="font-size:28px;line-height:1.35">careful → careful<b>ly</b></p><p style="font-size:28px;line-height:1.35">easy → eas<b>ily</b></p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">verb + adverb: He runs quickly.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Irregular</h3><p style="font-size:28px;line-height:1.35">good → <b>well</b></p><p style="font-size:28px;line-height:1.35">fast → <b>fast</b></p><p style="font-size:28px;line-height:1.35">hard → <b>hard</b></p><p style="font-size:28px;line-height:1.35">late → <b>late</b></p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Compare</h3><p style="font-size:28px;line-height:1.35">She runs <b>faster than</b> me.</p><p style="font-size:28px;line-height:1.35">He plays <b>better than</b> his brother.</p><p style="font-size:28px;line-height:1.35">Drive <b>more carefully</b>!</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Adjective: She’s a <b>good</b> player. · Adverb: She plays <b>well</b>. (not: she plays good)</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 85–87 · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Adjective or adverb?</h3><p style="font-size:28px;line-height:1.35">1. Pelé played football very (good / well).</p><p style="font-size:28px;line-height:1.35">2. Please speak (slow / slowly).</p><p style="font-size:28px;line-height:1.35">3. It’s an (easy / easily) game.</p><p style="font-size:28px;line-height:1.35">4. She works (hard / hardly).</p><p style="font-size:28px;line-height:1.35">5. He’s a (careful / carefully) driver.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Compare</h3><p style="font-size:24px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. Ana runs fast. Leo runs very fast. → Leo runs faster than Ana.</p><p style="font-size:28px;line-height:1.35">1. I swim well. My sister swims very well.</p><p style="font-size:28px;line-height:1.35">2. Tom drives carefully. Jo drives very carefully.</p><p style="font-size:28px;line-height:1.35">3. I get up early. My dad gets up very early.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 85 (quickly / badly…): Exercise 85.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 85 · 5/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: describe how people do sports</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Memory Chain</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Memory Chain</h3><p style="font-size:29px;line-height:1.35">Repeat and add one sport with an adverb.</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">“I play tennis badly.” → “I play tennis badly and I swim slowly.” → …</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">How long can your chain be?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Who does it better?</h3><p style="font-size:29px;line-height:1.35">You and someone you know:</p><p style="font-size:28px;line-height:1.35">Who runs faster? Who cooks better? Who drives more carefully? Who sleeps later?</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">My brother runs faster than me, but I swim better.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 14 · Sports and Free Time · 6/7</p>

<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Video: VOA Learning English, Let’s Learn English Lesson 44 · learningenglish.voanews.com · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 32–34</p><p style="font-size:28px;color:#955E14">Goal: give advice and rules</p></div><h2 style="font-size:56px;font-weight:400;line-height:1.1">should · must · mustn’t · don’t have to</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Advice</h3><p style="font-size:30px;line-height:1.35">You <b>should</b> drink more water.</p><p style="font-size:30px;line-height:1.35">You <b>shouldn’t</b> sleep so late.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">= it’s a good idea</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Strong rule</h3><p style="font-size:30px;line-height:1.35">You <b>must</b> take this medicine.</p><p style="font-size:30px;line-height:1.35">You <b>mustn’t</b> smoke here.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">mustn’t = it’s prohibited</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Not necessary</h3><p style="font-size:30px;line-height:1.35">You <b>don’t have to</b> go to the gym.</p><p style="font-size:30px;line-height:1.35">Walking is OK!</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">≠ mustn’t</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Symptoms: I have <b>a headache</b> · <b>a sore throat</b> · <b>a cold</b> · <b>a fever</b> · <b>backache</b> · I feel tired</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 32–34 · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. should or shouldn’t?</h3><p style="font-size:28px;line-height:1.35">1. I have a headache. → You ___ take a break.</p><p style="font-size:28px;line-height:1.35">2. I’m always tired. → You ___ go to bed so late.</p><p style="font-size:28px;line-height:1.35">3. I have a sore throat. → You ___ drink cold water.</p><p style="font-size:28px;line-height:1.35">4. I eat a lot of junk food. → You ___ eat more fruit.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. mustn’t or don’t have to?</h3><p style="font-size:28px;line-height:1.35">1. It’s a hospital. You ___ talk loudly.</p><p style="font-size:28px;line-height:1.35">2. It’s Sunday. You ___ get up early.</p><p style="font-size:28px;line-height:1.35">3. You ___ drive after drinking.</p><p style="font-size:28px;line-height:1.35">4. The test is free. You ___ pay.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 33 (should): Exercise 33.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 33 · 5/7</p>

<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 10 · Healthy Choices · 6/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ THE MODEL</p><p style="font-size:28px;color:#955E14">Goal: see how Lia talks about her childhood</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">When I was a child…</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:26px;line-height:1.35">I <b>was born</b> in Belém in 1990. My family <b>lived</b> in a small house near the river. My grandmother <b>cooked</b> every day, and I <b>was</b> always in the kitchen with her.</p><p style="font-size:26px;line-height:1.35">One day, when I <b>was</b> seven, I <b>was helping</b> her when I <b>dropped</b> a big pot of açaí on the floor. She didn’t get angry. She <b>laughed</b> and <b>taught</b> me to make it again.</p><p style="font-size:26px;line-height:1.35"><b>That’s why</b> I love cooking today.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Answer</h3><p style="font-size:27px;line-height:1.35">1. Where did Lia live?</p><p style="font-size:27px;line-height:1.35">2. What happened when she was seven?</p><p style="font-size:27px;line-height:1.35">3. How did her grandmother react?</p><p style="font-size:27px;line-height:1.35">4. Why is this story important?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 22 · model text written by CatWise · 3/7</p>

</section>

<figure class="sl" aria-label="Slide 2 de 11"><div class="fr"><section data-id="warmup" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: remember the -ed verbs</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Two truths and one lie</h2><div style="display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How to play</h3><p style="font-size:36px;line-height:1.35">1. Say 3 sentences about last week.</p><p style="font-size:36px;line-height:1.35">2. Two are true. One is a lie.</p><p style="font-size:36px;line-height:1.35">3. I guess: “I think number 2 is the lie.”</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Use regular verbs: worked, cooked, watched, visited, played, studied…</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">1. I cooked lasagna on Sunday.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">2. I watched a horror movie.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">3. I danced salsa at a party.</p><p style="font-size:30px;line-height:1.35">Say the -ed right:</p><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">cooked /t/</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">played /d/</p><p style="font-size:28px;line-height:1.35;background:#FFCB87;padding:4px 14px">visited /ɪd/</p></div></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 2 · What Happened? · 2/11</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 3 de 11"><div class="fr"><section data-id="watch" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: understand Anna’s problem</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Anna can’t come in</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learningenglish.voanews.com/a/lets-learn-english-lesson-27-i-cant-come-in/3457316.html"><span style="color:#FBF1E1">Watch the video ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4A3B2A">Anna calls work and then calls her doctor. Watch and choose a, b or c.</p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:34px;line-height:1.35">1. Why does Anna call work?</p><p style="font-size:36px;line-height:1.35">a) She is sick.<br>b) She is late.<br>c) She is on vacation.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:34px;line-height:1.35">2. What did she do yesterday afternoon?</p><p style="font-size:36px;line-height:1.35">a) She went shopping.<br>b) She cut wood and built a fire.<br>c) She slept all day.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:34px;line-height:1.35">3. Why was the first temperature so high?</p><p style="font-size:36px;line-height:1.35">a) She had a very high fever.<br>b) The room was very hot.<br>c) The thermometer was in her hot coffee.</p></div></div><p style="font-size:28px;line-height:1.35;color:#955E14">Answer like this: “I think it’s c, because…”</p>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Video: VOA Learning English, Let’s Learn English, Lesson 27 · learningenglish.voanews.com · 3/11</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 11"><div class="fr"><section data-id="findverbs" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">VOCABULARY</p><p style="font-size:28px;color:#955E14">Goal: find the irregular verbs</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">No -ed! What did Anna say?</h2><div style="display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Complete with the past</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. feel → felt  “Yesterday I felt fine.”</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px"><p style="font-size:36px;line-height:1.35">1. cut → ______</p><p style="font-size:36px;line-height:1.35">5. drink → ______</p><p style="font-size:36px;line-height:1.35">2. build → ______</p><p style="font-size:36px;line-height:1.35">6. say → ______</p><p style="font-size:36px;line-height:1.35">3. have → ______</p><p style="font-size:36px;line-height:1.35">7. hear → ______</p><p style="font-size:36px;line-height:1.35">4. sleep → ______</p><p style="font-size:36px;line-height:1.35">8. be → ______ / were</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Now tell Anna’s story</h3><p style="font-size:28px;line-height:1.35">Yesterday Anna <u>felt</u> fine. In the afternoon, she ______ wood.</p><p style="font-size:28px;line-height:1.35">Then she ______ a fire. Today she is sick. Last year she ______ the flu.</p><p style="font-size:28px;line-height:1.35">Then she ______ a lot and ______ a lot of water.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Words: cut · built · had · slept · drank</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 2 · What Happened? · 4/11</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 5 de 11"><div class="fr"><section data-id="rules" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 11</p><p style="font-size:28px;color:#955E14">Goal: learn irregular verbs in groups</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Irregular verbs: learn them in groups</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Same form</h3><p style="font-size:32px;line-height:1.35">cut → cut · put → put · hit → hit</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">I put my phone on the table.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">-ought / -aught (same sound)</h3><p style="font-size:32px;line-height:1.35">buy → bought · think → thought</p><p style="font-size:32px;line-height:1.35">bring → brought · teach → taught</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Change the vowel</h3><p style="font-size:32px;line-height:1.35">drink → drank · swim → swam</p><p style="font-size:32px;line-height:1.35">begin → began · sing → sang</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Totally new</h3><p style="font-size:32px;line-height:1.35">go → went · see → saw · eat → ate</p><p style="font-size:32px;line-height:1.35">have → had · be → was / were</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Same for everybody: I / you / she / they <span style="color:#955E14">went</span>. Never “goed” or “wented”.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 11 and Appendix (irregular verbs) · 5/11</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 6 de 11"><div class="fr"><section data-id="rules2" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 12</p><p style="font-size:28px;color:#955E14">Goal: say no and ask questions</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">didn’t + verb · Did…? + verb</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Negative</h3><p style="font-size:32px;line-height:1.35">I <b>didn’t go</b> to work.</p><p style="font-size:32px;line-height:1.35">She <b>didn’t sleep</b> well.</p><p style="font-size:26px;line-height:1.35;background:#FFCB87;padding:4px 14px">didn’t + base form</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">NOT: I didn’t went.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Yes/No questions</h3><p style="font-size:32px;line-height:1.35"><b>Did</b> you <b>go</b> out?</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Yes, I did.</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">No, I didn’t.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Wh- questions</h3><p style="font-size:32px;line-height:1.35">Where <b>did</b> you <b>go</b>?</p><p style="font-size:32px;line-height:1.35">What <b>did</b> you <b>eat</b>?</p><p style="font-size:32px;line-height:1.35">Who <b>did</b> you <b>see</b>?</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">After did / didn’t, the verb goes back to the base form: <span style="color:#955E14">did you see</span> (not saw).</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 12 · 6/11</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 7 de 11"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:0.8fr 1.2fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Write the past</h3><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. drink → drank</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px"><p style="font-size:32px;line-height:1.35">1. go → _____</p><p style="font-size:32px;line-height:1.35">5. make → _____</p><p style="font-size:32px;line-height:1.35">2. see → _____</p><p style="font-size:32px;line-height:1.35">6. take → _____</p><p style="font-size:32px;line-height:1.35">3. buy → _____</p><p style="font-size:32px;line-height:1.35">7. come → _____</p><p style="font-size:32px;line-height:1.35">4. eat → _____</p><p style="font-size:32px;line-height:1.35">8. get → _____</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Make it negative (–) or a question (?)</h3><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. I went to the gym. (–) → I didn’t go to the gym.</p><p style="font-size:36px;line-height:1.35">1. She saw the movie. (?)</p><p style="font-size:36px;line-height:1.35">2. We had lunch at two. (–)</p><p style="font-size:36px;line-height:1.35">3. They bought a new car. (?)</p><p style="font-size:36px;line-height:1.35">4. He took the bus. (–)</p><p style="font-size:36px;line-height:1.35">5. You slept well. (?)</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 11, exercise 11.2 · Unit 12, exercise 12.1. Do it in class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises based on Essential Grammar in Use (R. Murphy, Cambridge), Units 11–12 · 7/11</p>

</section>

<figure class="sl" aria-label="Slide 8 de 11"><div class="fr"><section data-id="pairs" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">

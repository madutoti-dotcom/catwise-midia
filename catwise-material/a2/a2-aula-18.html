<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 51 &amp; 35</p><p style="font-size:28px;color:#955E14">Goal: give opinions and invite</p></div><h2 style="font-size:50px;font-weight:400;line-height:1.1">I love watching films. Would you like to come?</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Likes + -ing</h3><p style="font-size:28px;line-height:1.35">I <b>love watching</b> horror films.</p><p style="font-size:28px;line-height:1.35">She <b>enjoys going</b> to the theatre.</p><p style="font-size:28px;line-height:1.35">I <b>don’t mind waiting</b>.</p><p style="font-size:28px;line-height:1.35">I <b>hate queuing</b>.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">want / would like + to</h3><p style="font-size:28px;line-height:1.35">I <b>want to see</b> it.</p><p style="font-size:28px;line-height:1.35"><b>Would you like to</b> come?</p><p style="font-size:28px;line-height:1.35">I’d love to! / Sorry, I can’t.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">would like = polite want</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Opinions</h3><p style="font-size:28px;line-height:1.35"><b>I think</b> it’s great.</p><p style="font-size:28px;line-height:1.35"><b>I agree</b> (with you).</p><p style="font-size:28px;line-height:1.35"><b>I don’t agree</b>. / <b>I disagree</b>.</p><p style="font-size:28px;line-height:1.35"><b>In my opinion</b>…</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Never: “I am agree” → <b>I agree</b> · “I enjoy to watch” → <b>I enjoy watching</b></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 51 and 35 · 4/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. -ing or to?</h3><p style="font-size:28px;line-height:1.35">1. I enjoy ___ (watch) old films.</p><p style="font-size:28px;line-height:1.35">2. Would you like ___ (go) to the cinema?</p><p style="font-size:28px;line-height:1.35">3. She hates ___ (wait) in queues.</p><p style="font-size:28px;line-height:1.35">4. We want ___ (see) the new comedy.</p><p style="font-size:28px;line-height:1.35">5. Do you mind ___ (sit) at the front?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Correct the mistakes</h3><p style="font-size:28px;line-height:1.35">1. I am agree with you.</p><p style="font-size:28px;line-height:1.35">2. Would you like come tonight?</p><p style="font-size:28px;line-height:1.35">3. I love to watching series.</p><p style="font-size:28px;line-height:1.35">4. In my opinion, is a great film.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 51 (to… and -ing): Exercise 51.1. In class if we have time, or at home.</p></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: agree, disagree and invite</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Movie debate</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Sentence Starters</h3><p style="font-size:28px;line-height:1.35">“I really enjoy…” · “I’d like to…” · “I think films are better…” · “I don’t mind…”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Agree or disagree?</h3><p style="font-size:27px;line-height:1.35">Films are better at the cinema than at home.</p><p style="font-size:27px;line-height:1.35">Brazilian films are better than Hollywood films.</p><p style="font-size:27px;line-height:1.35">Series are better than films.</p><p style="font-size:25px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I agree, because… · I don’t agree. I think… · Let’s agree to disagree!</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then: invite your teacher to a film this weekend.</p></div></div>

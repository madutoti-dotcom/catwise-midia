tart">9 is fine for me.</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35"><b>at</b> 9 o’clock · <b>on</b> Tuesday · <b>on</b> 14 May · <b>in</b> the morning · <b>in</b> June</p></div>

yle="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 96 (at / on / in): first exercise. In class if we have time, or at home.</p></div>

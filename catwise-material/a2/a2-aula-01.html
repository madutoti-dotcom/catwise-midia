<h2 style="font-size:64px;font-weight:400;line-height:1.1">Story Cubes: “Last weekend I…”</h2>
<div style="display:grid;grid-template-columns:1fr 1.3fr;gap:28px;align-self:stretch">
<div style="display:flex;flex-direction:column;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 32px">
<h3 style="font-size:36px;font-weight:400;color:#955E14">How to play</h3>
<p style="font-size:32px;line-height:1.35">1. Roll the dice.</p>
<p style="font-size:32px;line-height:1.35">2. Choose 3 pictures.</p>
<p style="font-size:32px;line-height:1.35">3. Say 3 sentences about your weekend.</p>
<p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://davebirss.com/storydice/"><span style="color:#FBF1E1">Open Story Cubes ↗</span></a></p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 32px">
<h3 style="font-size:36px;font-weight:400;color:#955E14">Use these sentences</h3>
<p style="font-size:32px;line-height:1.35">Last weekend I ________ (verb + ed).</p>
<p style="font-size:32px;line-height:1.35">Then I ________.</p>
<p style="font-size:32px;line-height:1.35">In the end, I was ________ (happy / tired).</p>
<div style="display:flex;flex-direction:column;gap:6px;background:#FFDE59;border-radius:12px;padding:16px 24px">
<p style="font-size:26px">Example</p>
<p style="font-size:30px;line-height:1.35">Last weekend I visited my aunt. Then we cooked lunch. In the end, I was happy.</p>
</div>
</div>
</div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 1 · Past Experiences · 2/7</p>

</section>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="watch" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:28px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center">
<p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p>
<p style="font-size:28px;color:#955E14">Goal: understand Anna’s story</p>
</div>
<div style="display:flex;gap:32px;align-items:center;align-self:stretch">
<h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Anna’s amazing day</h2>
<p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px"><a target="_blank" rel="noopener" href="https://learningenglish.voanews.com/a/lets-learn-english-lesson-24-yesterday-was-amazing/3439164.html"><span style="color:#FBF1E1">Watch the video ↗</span></a></p>
</div>
<p style="font-size:30px;color:#4A3B2A">Anna writes to her friend about one day in Washington, D.C. Watch and choose a, b or c.</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch">
<div style="display:flex;flex-direction:column;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px">
<h3 style="font-size:34px;font-weight:400;line-height:1.25">1. How did Anna’s day start?</h3>
<p style="font-size:30px;line-height:1.4">a) like a normal workday<br>b) at a party<br>c) at the airport</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px">
<h3 style="font-size:34px;font-weight:400;line-height:1.25">2. Why did she go for a walk?</h3>
<p style="font-size:30px;line-height:1.4">a) She was late.<br>b) She wanted a break.<br>c) She wanted to buy food.</p>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px">
<h3 style="font-size:34px;font-weight:400;line-height:1.25">3. What did she find?</h3>
<p style="font-size:30px;line-height:1.4">a) a museum<br>b) a festival<br>c) a new restaurant</p>
</div>
</div>
<p style="font-size:28px;color:#955E14">Answer like this: “I think it’s b, because…”</p>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Video: VOA Learning English, Let’s Learn English, Lesson 24 · learningenglish.voanews.com · 3/7</p>

</section>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 11</p><p style="font-size:28px;color:#955E14">Goal: write and say the -ed</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Write it, then say it</h2><div style="display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How to write it</h3><p style="font-size:31px;line-height:1.35">Most verbs: + ed → work<b>ed</b>, walk<b>ed</b></p><p style="font-size:31px;line-height:1.35">Ends in e: + d → danc<b>ed</b>, liv<b>ed</b></p><p style="font-size:31px;line-height:1.35">Consonant + y: → stud<b>ied</b>, tr<b>ied</b> (but play<b>ed</b>)</p><p style="font-size:31px;line-height:1.35">Short verb: double → sto<b>pp</b>ed, pla<b>nn</b>ed</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How to say it</h3><p style="font-size:31px;line-height:1.35">/t/ walked · cooked · danced</p><p style="font-size:31px;line-height:1.35">/d/ played · lived · cleaned</p><p style="font-size:31px;line-height:1.35">/id/ started · wanted · visited</p><p style="font-size:30px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Extra syllable only after t or d!</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Same for everybody: I / you / she / they <span style="color:#955E14">walked</span>. Never “work-ed” (uórkt).</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 11 · 4/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="grammar" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:24px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center">
<p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p>
<p style="font-size:28px;color:#955E14">Goal: use the rules</p>
</div>
<h2 style="font-size:60px;font-weight:400;line-height:1.1">Your turn</h2>
<div style="display:grid;grid-template-columns:0.8fr 1.2fr;gap:24px;align-self:stretch">
<div style="display:flex;flex-direction:column;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:24px 28px">
<h3 style="font-size:32px;font-weight:400;color:#955E14">A. Write the past</h3>
<p style="font-size:26px;background:#FFDE59;padding:4px 12px;align-self:flex-start">0. work → worked</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px">
<p style="font-size:30px">1. clean → ______</p>
<p style="font-size:30px">5. play → ______</p>
<p style="font-size:30px">2. stop → ______</p>
<p style="font-size:30px">6. try → ______</p>
<p style="font-size:30px">3. study → ______</p>
<p style="font-size:30px">7. plan → ______</p>
<p style="font-size:30px">4. live → ______</p>
<p style="font-size:30px">8. arrive → ______</p>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:24px 28px">
<h3 style="font-size:32px;font-weight:400;color:#955E14">B. Complete. Use: rain · stay · watch · open · finish · visit</h3>
<p style="font-size:26px;background:#FFDE59;padding:4px 12px;align-self:flex-start">0. I ______ (work) yesterday. → worked</p>
<p style="font-size:30px;line-height:1.35">1. It ________ all morning.</p>
<p style="font-size:30px;line-height:1.35">2. We ________ at home and ________ a movie.</p>
<p style="font-size:30px;line-height:1.35">3. It was hot, so I ________ the window.</p>
<p style="font-size:30px;line-height:1.35">4. The meeting ________ at 6 p.m.</p>
<p style="font-size:30px;line-height:1.35">5. Last year I ________ my cousins in Bahia.</p>
</div>
</div>
<div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch">
<p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p>
<p style="font-size:30px;line-height:1.3">Essential Grammar in Use · Unit 11 · Exercise 11.1. Do it in class if we have time, or at home.</p>
</div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 11 · 5/7</p>

</section>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="talk" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:28px;align-items:flex-start">

<p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p>
<p style="font-size:28px;color:#955E14">Goal: ask and answer about the past</p>
</div>
<div style="display:flex;gap:32px;align-items:center;align-self:stretch">
<h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Spin, answer, ask back</h2>
<p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px"><a target="_blank" rel="noopener" href="https://wordwall.net/pt/resource/108005924/past-tense-regular-verbs-questions"><span style="color:#FBF1E1">Spin the wheel ↗</span></a></p>
</div>
<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch">
<div style="display:flex;flex-direction:column;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:24px 32px">
<h3 style="font-size:32px;font-weight:400;color:#955E14">Answer like this</h3>
<p style="font-size:30px;line-height:1.35">Did you cook yesterday?</p>
<p style="font-size:30px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Yes, I did. I cooked rice and beans.</p>
<p style="font-size:30px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">No, I didn’t. I ordered a pizza.</p>
<p style="font-size:30px;line-height:1.35">Then ask me: “And you? Did you…?”</p>
</div>
<div style="display:flex;flex-direction:column;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:24px 32px">
<h3 style="font-size:32px;font-weight:400;color:#955E14">When you listen, say:</h3>
<div style="display:flex;gap:14px;flex-wrap:wrap">
<p style="font-size:30px;background:#FFCB87;padding:4px 14px">Really?</p>
<p style="font-size:30px;background:#FFCB87;padding:4px 14px">How cool!</p>
<p style="font-size:30px;background:#FFCB87;padding:4px 14px">Oh no!</p>
<p style="font-size:30px;background:#FFCB87;padding:4px 14px">No way!</p>
</div>
<p style="font-size:26px;color:#4A3B2A;line-height:1.35">These show interest in what the other person says.</p>
</div>
</div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Wheel: Wordwall, “Past Tense Regular Verbs Questions” (public activity) · 6/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: plan with food words</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Plan a party menu</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Your party: 10 guests</h3><p style="font-size:36px;line-height:1.35">What food do you need?</p><p style="font-size:36px;line-height:1.35">How much? How many?</p><p style="font-size:36px;line-height:1.35">What drinks?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">We need two bags of rice and a lot of chicken.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">We need a few bottles of soda.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Use: a bag of · a bottle of · a few · a little</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 8 · Plans and Predictions · 2/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="watch" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: hear plans and predictions</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">What will I do?</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learningenglish.voanews.com/a/lets-learn-english-lesson-34-what-will-i-do/3566043.html"><span style="color:#FBF1E1">Watch the video ↗</span></a></p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Questions</h3><p style="font-size:30px;line-height:1.35">1. Anna is getting ready for a party. What is her first costume?</p><p style="font-size:30px;line-height:1.35">2. What does Anna predict for Rebecca?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:30px;line-height:1.35">3. What is Kaveh going to do today?</p><p style="font-size:30px;line-height:1.35">4. What is Anna’s costume at the end?</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Write 2 sentences with <b>will</b> from the video.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Video: VOA Learning English, Let’s Learn English Lesson 34 · learningenglish.voanews.com · 3/7</p>

</section>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 27–28</p><p style="font-size:28px;color:#955E14">Goal: choose going to or will</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">going to or will?</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">going to = a plan</h3><p style="font-size:30px;line-height:1.35">I’m <b>going to</b> visit my aunt on Sunday.</p><p style="font-size:30px;line-height:1.35">Kaveh is <b>going to</b> propose today.</p><p style="font-size:30px;line-height:1.35">Are you <b>going to</b> study tonight?</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">You decided before.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">will = prediction / decision now</h3><p style="font-size:30px;line-height:1.35">You <b>will</b> get a job. She <b>will</b> say yes!</p><p style="font-size:30px;line-height:1.35">I think it <b>will</b> be a great party.</p><p style="font-size:30px;line-height:1.35">“The phone is ringing.” “I’ll answer it.”</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">won’t = will not</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">I think + will: I think you’ll love it. · I don’t think he’ll come. (not: I think he won’t)</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 27–28 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. going to or will?</h3><p style="font-size:29px;line-height:1.35">1. I bought paint. I ___ paint my room.</p><p style="font-size:29px;line-height:1.35">2. I think Brazil ___ win the next World Cup.</p><p style="font-size:29px;line-height:1.35">3. “I’m cold.” “I ___ close the window.”</p><p style="font-size:29px;line-height:1.35">4. We ___ visit Chile in July. We have the tickets!</p><p style="font-size:29px;line-height:1.35">5. Don’t worry. You ___ pass the test.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Make it negative</h3><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. It will rain. → It won’t rain.</p><p style="font-size:29px;line-height:1.35">1. I’m going to cook tonight.</p><p style="font-size:29px;line-height:1.35">2. She will be late.</p><p style="font-size:29px;line-height:1.35">3. They’re going to move.</p><p style="font-size:29px;line-height:1.35">4. I think he will call.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 27 (I’m going to…): Exercise 27.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 27 · 5/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: make predictions</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">3 Clues: the fortune teller</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. 3 Clues</h3><p style="font-size:30px;line-height:1.35">Your teacher gives 3 clues about a famous person.</p><p style="font-size:30px;line-height:1.35">You guess: “Is it…?”</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">He’s a singer. He’s from Bahia. He sings with his sister.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Be a fortune teller</h3><p style="font-size:30px;line-height:1.35">Look at your teacher’s hand (or a card).</p><p style="font-size:30px;line-height:1.35">Make 5 predictions: job, love, money, travel, a surprise.</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">You will travel to Japan. You won’t…</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then: your teacher tells you her plans with going to.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 8 · Plans and Predictions · 6/7</p>

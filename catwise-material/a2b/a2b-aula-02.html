<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 2 · Can You Help Me? · 2/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LISTEN &amp; ANSWER</p><p style="font-size:28px;color:#3E5468">Goal: understand what the boss needs</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:58px;font-weight:400;line-height:1.1;flex:1">A request from your boss</h2><p style="font-size:30px;background:#1F2933;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglish.britishcouncil.org/free-resources/listening/a1/request-your-boss"><span style="color:#EEF1F4">Listen on British Council ↗</span></a></p></div><p style="font-size:32px;line-height:1.35;color:#4B5563">Susanne asks Mario for help with three things. Listen and put them in order.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Put in order (1, 2, 3)</h3><p style="font-size:36px;line-height:1.35">a) write a report on the new project</p><p style="font-size:36px;line-height:1.35">b) email the customer in Germany</p><p style="font-size:36px;line-height:1.35">c) invite everyone to the team meeting</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Then answer</h3><p style="font-size:36px;line-height:1.35">4. Which task is very urgent?</p><p style="font-size:36px;line-height:1.35">5. What does Mario do before he emails the team?</p><p style="font-size:36px;line-height:1.35">6. When does Susanne need the report?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">Audio: British Council LearnEnglish, “A request from your boss” (A1) · link only · 3/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: ask and answer politely</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Asking for help</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Ask</h3><p style="font-size:32px;line-height:1.35"><b>Can you</b> send me the file?</p><p style="font-size:32px;line-height:1.35"><b>Could you</b> book a room, <b>please</b>?</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Could = more polite</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Say yes</h3><p style="font-size:32px;line-height:1.35">Sure.</p><p style="font-size:32px;line-height:1.35">No problem.</p><p style="font-size:32px;line-height:1.35">Of course. I’ll do it today.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Say no (nicely)</h3><p style="font-size:32px;line-height:1.35"><b>Sorry, I can’t</b> right now.</p><p style="font-size:32px;line-height:1.35">I’m in a meeting.</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Can I do it tomorrow?</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">How urgent?&nbsp; It’s <b>urgent</b>. · It’s a <b>priority</b>. · I need it <b>by</b> Friday. · There’s <b>no hurry</b>.</p></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: use the language</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. Make it polite</h3><p style="font-size:26px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">0. Send the report. → Could you send the report, please?</p><p style="font-size:32px;line-height:1.35">1. Book a meeting room.</p><p style="font-size:32px;line-height:1.35">2. Call the client.</p><p style="font-size:32px;line-height:1.35">3. Check this email.</p><p style="font-size:32px;line-height:1.35">4. Print the agenda.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Complete</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">urgent</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">hurry</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">by</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">priority</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">problem</p></div><p style="font-size:30px;line-height:1.35">1. “Can you help me?” “No ______.”</p><p style="font-size:30px;line-height:1.35">2. I need it ______ Friday.</p><p style="font-size:30px;line-height:1.35">3. It’s very ______: do it first.</p><p style="font-size:30px;line-height:1.35">4. There’s no ______. Next week is fine.</p><p style="font-size:30px;line-height:1.35">5. This client is our ______ this month.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">British Council, “A request from your boss”: Task 1 and Task 2 online. In class if we have time, or at home.</p></div>

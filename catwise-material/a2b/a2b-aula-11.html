<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#3E5468">Goal: talk about your work history</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">My first job</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What was your first job?</p><p style="font-size:36px;line-height:1.35">2. When did you start? How long did you stay?</p><p style="font-size:36px;line-height:1.35">3. What did you learn there?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">My first job was in a bookshop.</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I started in 2015 and stayed for two years.</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I learned to talk to customers.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 11 · The Job Interview · 2/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p><p style="font-size:28px;color:#3E5468">Goal: notice good interview answers</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Anna’s interview</h2><p style="font-size:30px;background:#1F2933;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=KN2jyw6D1ak"><span style="color:#EEF1F4">Watch on YouTube ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4B5563">Anna has a job interview at Tip Top Trading. A voice helps her. Watch and answer.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Questions</h3><p style="font-size:30px;line-height:1.35">1. What job does Anna want?</p><p style="font-size:30px;line-height:1.35">2. What is her example of sales experience?</p><p style="font-size:30px;line-height:1.35">3. What was her role in the university debating society?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tick the phrases you hear</h3><p style="font-size:28px;line-height:1.35">□ A good example that comes to mind…</p><p style="font-size:28px;line-height:1.35">□ I’m particularly proud of…</p><p style="font-size:28px;line-height:1.35">□ My biggest weakness is…</p><p style="font-size:28px;line-height:1.35">□ Timekeeping is important to me.</p><p style="font-size:28px;line-height:1.35">□ I always try to complete my work on time.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">Video: BBC Learning English, “English at Work”, episode 1 (YouTube) · link only · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: answer with an example</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Answer + example</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Experience</h3><p style="font-size:28px;line-height:1.35">I <b>worked</b> at Brightline <b>for</b> three years.</p><p style="font-size:28px;line-height:1.35">I <b>was responsible for</b> customer service.</p><p style="font-size:28px;line-height:1.35">I <b>started</b> in 2021.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Strengths</h3><p style="font-size:28px;line-height:1.35">I’m <b>good at</b> solving problems.</p><p style="font-size:28px;line-height:1.35">I’m <b>organised</b> and <b>reliable</b>.</p><p style="font-size:28px;line-height:1.35">I <b>work well</b> in a team.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Give an example</h3><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">A good example is…</p><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I’m particularly proud of…</p><p style="font-size:28px;line-height:1.35">Last year I organised a trade fair.</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">good <b>at</b> + noun or -ing: good at numbers · good at <b>talking</b> to clients</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 11 · The Job Interview · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: build good answers</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. Complete (past simple)</h3><p style="font-size:26px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">0. I ______ (work) in sales. → worked</p><p style="font-size:28px;line-height:1.35">1. I ______ (start) my career in 2018.</p><p style="font-size:28px;line-height:1.35">2. I ______ (be) responsible for five clients.</p><p style="font-size:28px;line-height:1.35">3. We ______ (not have) a big team.</p><p style="font-size:28px;line-height:1.35">4. I ______ (learn) a lot about logistics.</p><p style="font-size:28px;line-height:1.35">5. Why ______ you ______ (leave) your last job?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Match answer and example</h3><p style="font-size:28px;line-height:1.35">1. I’m good at solving problems.</p><p style="font-size:28px;line-height:1.35">2. I work well in a team.</p><p style="font-size:28px;line-height:1.35">3. I’m organised.</p><p style="font-size:26px;line-height:1.35;color:#4B5563">a) I always finish my reports before the deadline. · b) Last month I helped a client with a late delivery in one day. · c) I organised a project with four colleagues.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 2 “Job interview”: the dialogue. Your teacher shows the PDF.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise exercises · EXTRA: Business book (Materiais ESL), Unit 2 · 5/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#3E5468">Goal: answer five interview questions</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Role-play: the interview</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Interviewer asks</h3><p style="font-size:30px;line-height:1.35">1. Tell me about yourself.</p><p style="font-size:30px;line-height:1.35">2. What did you do in your last job?</p><p style="font-size:30px;line-height:1.35">3. What are you good at?</p><p style="font-size:30px;line-height:1.35">4. Can you give me an example?</p><p style="font-size:30px;line-height:1.35">5. Why do you want this job?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">You answer</h3><p style="font-size:30px;line-height:1.35">2 or 3 sentences for each question.</p><p style="font-size:30px;line-height:1.35">Use one real example.</p><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">A good example is…</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Then change roles: you interview your teacher.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 11 · The Job Interview · 6/7</p>

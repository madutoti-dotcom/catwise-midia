59;padding:4px 14px;align-self:flex-start">I started English when I was 30.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Say the -ed right: moved /d/ · started /ɪd/ · worked /t/</p></div></div>

<figure class="sl" aria-label="Slide 4 de 11"><div class="fr"><section data-id="rules" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 13</p><p style="font-size:28px;color:#955E14">Goal: say what was happening</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">was / were + -ing</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Positive</h3><p style="font-size:36px;line-height:1.35">I / he / she / it <b>was working</b></p><p style="font-size:36px;line-height:1.35">you / we / they <b>were working</b></p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Negative</h3><p style="font-size:36px;line-height:1.35">I <b>wasn’t</b> sleeping.</p><p style="font-size:36px;line-height:1.35">They <b>weren’t</b> listening.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Questions</h3><p style="font-size:36px;line-height:1.35"><b>Was</b> she <b>sleeping</b>?</p><p style="font-size:36px;line-height:1.35">What <b>were</b> you <b>doing</b>?</p><p style="font-size:30px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Yes, she was. / No, she wasn’t.</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Use it for an action in progress at a time in the past: <span style="color:#955E14">At 8 p.m. yesterday, I was cooking.</span></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 13 · 4/11</p>

</section>

<figure class="sl" aria-label="Slide 5 de 11"><div class="fr"><section data-id="rules2" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 14</p><p style="font-size:28px;color:#955E14">Goal: tell a story with two past tenses</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Long action + short action</h2><div style="align-self:stretch;display:flex;flex-direction:column;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:30px 36px"><div style="position:relative;height:90px"><div style="position:absolute;left:0;right:0;top:34px;height:22px;background:#FFCB87;border-radius:11px"></div><p style="position:absolute;left:20px;top:-4px;font-size:30px;color:#955E14">I was cooking dinner… (long)</p><div style="position:absolute;left:58%;top:10px;width:16px;height:70px;background:#955E14"></div><p style="position:absolute;left:61%;top:44px;font-size:30px">⚡ the phone rang (short)</p></div><p style="font-size:40px;line-height:1.35">I <b>was cooking</b> dinner <b>when</b> the phone <b>rang</b>.</p><p style="font-size:40px;line-height:1.35"><b>While</b> I <b>was cooking</b>, the phone <b>rang</b>.</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">when + short action (past simple)</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">when the phone rang</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">while + long action (was/were + -ing)</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">while I was cooking</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 14 · 5/11</p>

<figure class="sl" aria-label="Slide 6 de 11"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. was / were + -ing</h3><p style="font-size:27px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. At 7 a.m. I ___ (have) breakfast. → was having</p><p style="font-size:31px;line-height:1.35">1. At 9 p.m. we ___ (watch) a series.</p><p style="font-size:31px;line-height:1.35">2. She ___ (not / work) at 3.</p><p style="font-size:31px;line-height:1.35">3. What ___ you ___ (do) at midnight?</p><p style="font-size:31px;line-height:1.35">4. The kids ___ (play) in the park.</p><p style="font-size:31px;line-height:1.35">5. It ___ (rain) when I woke up.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Past continuous or past simple?</h3><p style="font-size:27px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. I ___ (cook) when the phone ___ (ring). → was cooking, rang</p><p style="font-size:31px;line-height:1.35">1. While we ___ (walk) home, it ___ (start) to rain.</p><p style="font-size:31px;line-height:1.35">2. She ___ (fall) when she ___ (run).</p><p style="font-size:31px;line-height:1.35">3. When I ___ (arrive), they ___ (have) dinner.</p><p style="font-size:31px;line-height:1.35">4. He ___ (meet) his wife while he ___ (live) in Lisbon.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 13, exercise 13.1 · Unit 14, exercise 14.2. Do it in class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises based on Essential Grammar in Use (R. Murphy, Cambridge), Units 13–14 · 6/11</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: answer with the right past tense</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Spin and answer</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://wordwall.net/resource/12890913/simple-past-and-past-continuous-questions"><span style="color:#FBF1E1">Spin the wheel ↗</span></a></p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How to answer</h3><p style="font-size:36px;line-height:1.35">Answer with a full sentence.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">At seven o’clock yesterday, I was driving home.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">For my last birthday, I went to a bar.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Then ask back</h3><p style="font-size:36px;line-height:1.35">“And you? What were you doing…?”</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Listen and react: Really? · No way! · How cool!</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: tell a short story</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">A day I’ll never forget</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Use this order</h3><p style="font-size:36px;line-height:1.35">1. It was… (when? where?)</p><p style="font-size:36px;line-height:1.35">2. I was… -ing (what were you doing?)</p><p style="font-size:36px;line-height:1.35">3. when… (what happened?)</p><p style="font-size:36px;line-height:1.35">4. Then I… / In the end…</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35">It was a Sunday in 2019. I was walking on the beach with my dog when I saw a famous singer. Then I asked for a photo. In the end, he said yes!</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 4 · What Were You Doing? · 10/11</p>

14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Listen for: “It is <span style="color:#955E14">pricier than</span> the Mountain Getaway.” · “It is our <span style="color:#955E14">priciest</span> vacation.”</p></div>

<figure class="sl" aria-label="Slide 4 de 11"><div class="fr"><section data-id="rules" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 86–87</p><p style="font-size:28px;color:#955E14">Goal: compare two things</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Comparatives: bigger, more expensive</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Short adjectives: + er</h3><p style="font-size:36px;line-height:1.35">cheap → cheaper · old → older</p><p style="font-size:36px;line-height:1.35">big → bigger · hot → hotter</p><p style="font-size:36px;line-height:1.35">busy → busier · easy → easier</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Long adjectives: more + adjective</h3><p style="font-size:36px;line-height:1.35">expensive → more expensive</p><p style="font-size:36px;line-height:1.35">modern → more modern</p><p style="font-size:36px;line-height:1.35">interesting → more interesting</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Irregular</h3><p style="font-size:36px;line-height:1.35">good → better · bad → worse</p><p style="font-size:36px;line-height:1.35">far → farther / further</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">+ than</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">São Paulo is bigger than Curitiba.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Say “than” fast and weak: /ðən/</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 86–87 · 4/11</p>

</section>

<figure class="sl" aria-label="Slide 5 de 11"><div class="fr"><section data-id="rules2" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 88–89</p><p style="font-size:28px;color:#955E14">Goal: say “the most” and “not as … as”</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Superlatives: the biggest, the most expensive</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Short: the + est</h3><p style="font-size:36px;line-height:1.35">the cheapest</p><p style="font-size:36px;line-height:1.35">the biggest</p><p style="font-size:36px;line-height:1.35">the busiest</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">the busiest street in town</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Long: the most</h3><p style="font-size:36px;line-height:1.35">the most expensive</p><p style="font-size:36px;line-height:1.35">the most beautiful</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">the most beautiful park</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Irregular</h3><p style="font-size:36px;line-height:1.35">the best</p><p style="font-size:36px;line-height:1.35">the worst</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">the best pizza of my life</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">not as … as = less: <span style="color:#955E14">Rio is not as cold as Curitiba.</span> (Curitiba is colder.)</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 88–89 · 5/11</p>

</section>

<figure class="sl" aria-label="Slide 6 de 11"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:0.85fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Write the comparative</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. cheap → cheaper than</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px"><p style="font-size:29px;line-height:1.35">1. big → _____</p><p style="font-size:29px;line-height:1.35">4. good → _____</p><p style="font-size:29px;line-height:1.35">2. busy → _____</p><p style="font-size:29px;line-height:1.35">5. bad → _____</p><p style="font-size:29px;line-height:1.35">3. expensive → _____</p><p style="font-size:29px;line-height:1.35">6. modern → _____</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete with the superlative or as … as</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. This is ___ (old) building here. → the oldest</p><p style="font-size:31px;line-height:1.35">1. Sunday is ___ (quiet) day of the week.</p><p style="font-size:31px;line-height:1.35">2. That was ___ (good) pizza of my life.</p><p style="font-size:31px;line-height:1.35">3. The metro is ___ (fast) way to work.</p><p style="font-size:31px;line-height:1.35">4. January is ___ (expensive) month to travel.</p><p style="font-size:31px;line-height:1.35">5. Rio is not as ___ (cold) as Curitiba.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 87, first exercise · Unit 89, first exercise. Do it in class if we have time, or at home.</p></div>

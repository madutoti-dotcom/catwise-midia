<figure class="sl" aria-label="Slide 2 de 7"><div class="fr"><section data-id="warmup" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#3E5468">Goal: talk about emails at work</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What’s in your inbox?</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. How many emails do you get a day?</p><p style="font-size:36px;line-height:1.35">2. Who do you write to in English?</p><p style="font-size:36px;line-height:1.35">3. What are you doing this week? (3 plans)</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I get about 40 emails a day.</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I write to suppliers in Chile.</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">On Friday I’m sending the monthly report.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 6 · Writing an Email · 2/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">READ &amp; COMPARE</p><p style="font-size:28px;color:#3E5468">Goal: notice formal and informal emails</p></div><h2 style="font-size:56px;font-weight:400;line-height:1.1">Two emails, same request</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Email A</h3><p style="font-size:26px;line-height:1.35"><b>Subject:</b> Price list request</p><p style="font-size:26px;line-height:1.35">Dear Ms. Prado,</p><p style="font-size:26px;line-height:1.35">I am writing to ask for your new price list. Could you send it by Friday, please?</p><p style="font-size:26px;line-height:1.35">Thank you in advance.</p><p style="font-size:26px;line-height:1.35">Best regards,<br>Carla Dias · Brightline</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Email B</h3><p style="font-size:26px;line-height:1.35"><b>Subject:</b> Price list</p><p style="font-size:26px;line-height:1.35">Hi Diego,</p><p style="font-size:26px;line-height:1.35">Can you send me the new price list? I need it by Friday.</p><p style="font-size:26px;line-height:1.35">Thanks!</p><p style="font-size:26px;line-height:1.35">Carla</p><p style="font-size:26px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Which one is for a client? Which one is for a colleague? How do you know?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 6 · emails written by CatWise · 3/7</p>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: the four parts of an email</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Start · say why · ask · finish</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">To a client (formal)</h3><p style="font-size:30px;line-height:1.35"><b>Dear</b> Mr. Okafor, / Dear Ms. Prado,</p><p style="font-size:30px;line-height:1.35"><b>I am writing to</b> ask about… / confirm…</p><p style="font-size:30px;line-height:1.35"><b>Could you</b> send me…, please?</p><p style="font-size:30px;line-height:1.35"><b>Please find attached</b> the report.</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Best regards, / Kind regards,</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">To a colleague (informal)</h3><p style="font-size:30px;line-height:1.35"><b>Hi</b> Diego, / Hello Aiko,</p><p style="font-size:30px;line-height:1.35"><b>Just a quick note</b> about…</p><p style="font-size:30px;line-height:1.35"><b>Can you</b> send me…?</p><p style="font-size:30px;line-height:1.35"><b>Here’s</b> the report.</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Thanks, / Best,</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Subject = short and clear: “Meeting on Friday” · “Price list request” · “Invoice 4471”</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 6 · Writing an Email · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: build an email</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. Formal (F) or informal (I)?</h3><p style="font-size:30px;line-height:1.35">1. Hi Ana,</p><p style="font-size:30px;line-height:1.35">2. I am writing to confirm our meeting.</p><p style="font-size:30px;line-height:1.35">3. Thanks!</p><p style="font-size:30px;line-height:1.35">4. Kind regards,</p><p style="font-size:30px;line-height:1.35">5. Can you call me?</p><p style="font-size:30px;line-height:1.35">6. Please find attached the invoice.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Put the email in order (1–5)</h3><p style="font-size:28px;line-height:1.35">__ Could you confirm by Wednesday, please?</p><p style="font-size:28px;line-height:1.35">__ Best regards, Rob Hill</p><p style="font-size:28px;line-height:1.35">__ Dear Mr. Okafor,</p><p style="font-size:28px;line-height:1.35">__ I am writing to invite you to visit our office on 14 May at 10 a.m.</p><p style="font-size:28px;line-height:1.35">__ Please find attached the address and a map.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 5 “Writing an email”: the model email. Your teacher shows the PDF.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise exercises · EXTRA: Business book (Materiais ESL), Unit 5 · 5/7</p>

</section>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="write" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WRITING &amp; SPEAKING</p><p style="font-size:28px;color:#3E5468">Goal: write a real email in 6 minutes</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Write it, then say it</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Choose one</h3><p style="font-size:30px;line-height:1.35">1. Ask a supplier for a price list.</p><p style="font-size:30px;line-height:1.35">2. Invite a client to a meeting next week.</p><p style="font-size:30px;line-height:1.35">3. Tell your team the meeting is now on Friday.</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Or use a real email you need to write this week.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Checklist</h3><p style="font-size:30px;line-height:1.35">□ clear subject</p><p style="font-size:30px;line-height:1.35">□ greeting (Dear… / Hi…)</p><p style="font-size:30px;line-height:1.35">□ why you are writing</p><p style="font-size:30px;line-height:1.35">□ request + deadline</p><p style="font-size:30px;line-height:1.35">□ closing + your name</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 6 · Writing an Email · 6/7</p>

:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I tried local food: pão de queijo!</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Which one did you NOT do? “I didn’t rent a car.”</p></div></div>

<figure class="sl" aria-label="Slide 4 de 11"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READING</p><p style="font-size:28px;color:#955E14">Goal: understand a holiday story</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Ten days in Bahia</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px 44px;align-self:stretch;flex:1;align-content:center;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:30px 40px"><p style="font-size:35px;line-height:1.35;line-height:1.45"><b>Two years ago</b>, I went on holiday to Bahia with my family. We flew from São Paulo to Salvador <b>on a Friday in January</b>. It was very hot!</p><p style="font-size:35px;line-height:1.35;line-height:1.45"><b>On the first day</b>, we went sightseeing in Pelourinho. The old buildings were beautiful, and we bought souvenirs for our friends. <b>In the evening</b>, we tried acarajé. I loved it, but my little brother didn’t like the pepper.</p><p style="font-size:35px;line-height:1.35;line-height:1.45"><b>Three days later</b>, we rented a car and drove to Praia do Forte. We saw baby turtles at a nature project and stayed in a small hotel near the beach. My dad got sunburned because he didn’t use sunscreen.</p><p style="font-size:35px;line-height:1.35;line-height:1.45"><b>On our last night</b>, we watched the sunset at Farol da Barra. It was the best holiday of my life. — Rafael</p></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:32px;line-height:1.35">First read: Was it a good holiday or a bad holiday? How do you know?</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Text by CatWise · 4/11</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READING</p><p style="font-size:28px;color:#955E14">Goal: find details in the text</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">True or false?</h2><div style="display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Write T or F</h3><p style="font-size:36px;line-height:1.35">1. They went to Bahia last year. ___</p><p style="font-size:36px;line-height:1.35">2. They flew to Salvador. ___</p><p style="font-size:36px;line-height:1.35">3. The brother loved the pepper. ___</p><p style="font-size:36px;line-height:1.35">4. They rented a car. ___</p><p style="font-size:36px;line-height:1.35">5. Dad got sunburned. ___</p><p style="font-size:36px;line-height:1.35">6. They watched the sunset on the first night. ___</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Find 7 time phrases</h3><p style="font-size:28px;line-height:1.35;color:#4A3B2A">They tell us WHEN.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">two years ago</p><p style="font-size:36px;line-height:1.35">on ______ · in ______</p><p style="font-size:36px;line-height:1.35">on the ______ · in the ______</p><p style="font-size:36px;line-height:1.35">______ later · on our ______</p></div></div>

<figure class="sl" aria-label="Slide 6 de 11"><div class="fr"><section data-id="rules" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · TIME PHRASES</p><p style="font-size:28px;color:#955E14">Goal: say when it happened</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">When did it happen?</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">last + …</h3><p style="font-size:36px;line-height:1.35">last week / month</p><p style="font-size:36px;line-height:1.35">last year / summer</p><p style="font-size:36px;line-height:1.35">last Saturday</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">No “in” and no “the”.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">… ago</h3><p style="font-size:36px;line-height:1.35">two years ago</p><p style="font-size:36px;line-height:1.35">three days ago</p><p style="font-size:36px;line-height:1.35">a long time ago</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Português: “há dois anos”.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">in · on · when</h3><p style="font-size:36px;line-height:1.35">in January · in 2023</p><p style="font-size:36px;line-height:1.35">on Friday · on the first day</p><p style="font-size:36px;line-height:1.35">when I was 10</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Don’t say: “in last year” · “before two years” · “has two years”</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 19 (ago) and 96 (at/on/in) · 6/11</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use time phrases and the past</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Complete: last · ago · in · on · when</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. I went to Rio ___ 2019. → in</p><p style="font-size:32px;line-height:1.35">1. We visited Gramado three years ___.</p><p style="font-size:32px;line-height:1.35">2. She traveled ___ summer.</p><p style="font-size:32px;line-height:1.35">3. They arrived ___ Saturday.</p><p style="font-size:32px;line-height:1.35">4. I went to Disney ___ I was 12.</p><p style="font-size:32px;line-height:1.35">5. My party was ___ May.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Find the mistake and correct it</h3><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. I went to Recife in last year. → last year</p><p style="font-size:32px;line-height:1.35">1. We traveled before two years.</p><p style="font-size:32px;line-height:1.35">2. She go to Paris last month.</p><p style="font-size:32px;line-height:1.35">3. Did you went to the beach?</p><p style="font-size:32px;line-height:1.35">4. I visited my aunt at Sunday.</p><p style="font-size:32px;line-height:1.35">5. They didn’t stayed in a hotel.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 96 (at / on / in), first exercise · Unit 12, exercise 12.3. Do it in class if we have time, or at home.</p></div>

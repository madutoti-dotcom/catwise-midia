<figure class="sl" aria-label="Slide 2 de 7"><div class="fr"><section data-id="warmup" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: describe your city</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What’s your city like?</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. Is your city clean or dirty?</p><p style="font-size:36px;line-height:1.35">2. Where’s the nearest park? How do I get there?</p><p style="font-size:36px;line-height:1.35">3. What should people do to help the city?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">The park is opposite the school.</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">People should take the bus more.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Use: opposite · next to · should</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 16 · Our Planet · 2/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ &amp; DISCUSS</p><p style="font-size:28px;color:#955E14">Goal: understand a community project</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Green Street</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:27px;line-height:1.35">Five years ago, Rua das Flores had <b>too much</b> rubbish and <b>too many</b> cars. There <b>weren’t enough</b> trees, and in summer it was very hot.</p><p style="font-size:27px;line-height:1.35">Then the neighbours made a plan. Now, every family <b>has to</b> separate its rubbish. You <b>mustn’t</b> park on the pavement. On the first Sunday of every month, everyone <b>has to</b> help in the street garden.</p><p style="font-size:27px;line-height:1.35">Today there are thirty new trees, and the street is cooler. “We <b>don’t have to</b> wait for the government,” says Dona Célia, 70. “We can start in our street.”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Answer</h3><p style="font-size:28px;line-height:1.35">1. What were the 3 problems?</p><p style="font-size:28px;line-height:1.35">2. What are 2 rules now?</p><p style="font-size:28px;line-height:1.35">3. What happens on the first Sunday?</p><p style="font-size:28px;line-height:1.35">4. What has changed?</p><p style="font-size:28px;line-height:1.35">5. Would this work in your street?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 16 · text written by CatWise · 3/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 32, 34, 90–91</p><p style="font-size:28px;color:#955E14">Goal: talk about problems and rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">There’s too much plastic!</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Rules</h3><p style="font-size:28px;line-height:1.35">You <b>have to</b> / <b>must</b> separate your rubbish.</p><p style="font-size:28px;line-height:1.35">You <b>mustn’t</b> throw rubbish in the river.</p><p style="font-size:28px;line-height:1.35">You <b>don’t have to</b> buy new bags.</p><p style="font-size:28px;line-height:1.35">She <b>has to</b> · Do I <b>have to</b>…?</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Past: we <b>had to</b></p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Problems</h3><p style="font-size:27px;line-height:1.35"><b>too much</b> + uncountable: too much plastic, noise</p><p style="font-size:27px;line-height:1.35"><b>too many</b> + countable: too many cars</p><p style="font-size:27px;line-height:1.35"><b>not enough</b> + noun: not enough trees</p><p style="font-size:27px;line-height:1.35">adjective + <b>enough</b>: not big enough</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">too much ≠ a lot of: <b>too much</b> = more than is good · <b>a lot of</b> = just a big number</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 32, 34, 90 and 91 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. too much, too many or not enough?</h3><p style="font-size:28px;line-height:1.35">1. There are ___ cars in the city centre.</p><p style="font-size:28px;line-height:1.35">2. We use ___ plastic.</p><p style="font-size:28px;line-height:1.35">3. There are ___ parks. We need more!</p><p style="font-size:28px;line-height:1.35">4. There’s ___ noise at night. I can’t sleep.</p><p style="font-size:28px;line-height:1.35">5. There aren’t ___ bins in the street.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. must, mustn’t or don’t have to?</h3><p style="font-size:28px;line-height:1.35">1. You ___ throw batteries in the normal bin.</p><p style="font-size:28px;line-height:1.35">2. You ___ turn off the lights when you leave.</p><p style="font-size:28px;line-height:1.35">3. The bus is free on Sundays. You ___ pay.</p><p style="font-size:28px;line-height:1.35">4. You ___ feed the animals in the park.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 91 (too): Exercise 91.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 91 · 5/7</p>

</section>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="rules" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: make rules for a better city</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Rules for a greener city</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Category Game (60 seconds)</h3><p style="font-size:29px;line-height:1.35">Say as many words as you can:</p><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:25px;line-height:1.35;background:#FFCB87;padding:4px 14px">things we recycle</p><p style="font-size:25px;line-height:1.35;background:#FFCB87;padding:4px 14px">transport</p><p style="font-size:25px;line-height:1.35;background:#FFCB87;padding:4px 14px">nature</p><p style="font-size:25px;line-height:1.35;background:#FFCB87;padding:4px 14px">problems in big cities</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. You are the mayor!</h3><p style="font-size:29px;line-height:1.35">Make 5 rules for your city.</p><p style="font-size:28px;line-height:1.35">Use: must · mustn’t · have to · don’t have to</p><p style="font-size:28px;line-height:1.35">Then explain the problem: too much / too many / not enough.</p><p style="font-size:25px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">People mustn’t use plastic bags, because there’s too much plastic in the sea.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 16 · Our Planet · 6/7</p>

</section>

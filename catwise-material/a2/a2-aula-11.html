<figure class="sl" aria-label="Slide 2 de 7"><div class="fr"><section data-id="warmup" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: give advice</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">I need advice!</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Your teacher’s problems</h3><p style="font-size:36px;line-height:1.35">“I have a test on Friday and I didn’t study.”</p><p style="font-size:36px;line-height:1.35">“I work too much. I never see my friends.”</p><p style="font-size:36px;line-height:1.35">“I want to learn English faster.”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Use</h3><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">You should… · You shouldn’t…</p><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">You must… · You don’t have to…</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then: what is your busiest day this week?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 11 · A Busy Week · 2/7</p>

</section>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ &amp; CHECK</p><p style="font-size:28px;color:#955E14">Goal: understand someone’s arrangements</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Bruno’s week</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:27px;line-height:1.35">Bruno is a nurse and he’s studying English at night. This week is busy. On Monday he’s <b>working</b> from 7 to 7. On Tuesday evening he’s <b>having</b> his English class at 8.</p><p style="font-size:27px;line-height:1.35">On Wednesday he’s <b>taking</b> his daughter to the dentist at 10, and in the afternoon he’s <b>meeting</b> his boss. On Friday he isn’t <b>working</b>: he’s <b>flying</b> to Recife for his brother’s wedding.</p><p style="font-size:27px;line-height:1.35">“Are you <b>doing</b> anything on Thursday?” asks his friend Léo. “Yes, I’m <b>sleeping</b>!” says Bruno.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">True or false?</h3><p style="font-size:28px;line-height:1.35">1. Bruno works in a hospital.</p><p style="font-size:28px;line-height:1.35">2. His English class is on Tuesday morning.</p><p style="font-size:28px;line-height:1.35">3. He’s meeting his boss on Wednesday.</p><p style="font-size:28px;line-height:1.35">4. He’s working on Friday.</p><p style="font-size:28px;line-height:1.35">5. What is he doing on Thursday?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 11 · text written by CatWise · 3/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 26</p><p style="font-size:28px;color:#955E14">Goal: talk about arrangements</p></div><h2 style="font-size:56px;font-weight:400;line-height:1.1">I’m meeting my boss on Wednesday.</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Arrangements</h3><p style="font-size:30px;line-height:1.35">I<b>’m working</b> on Saturday.</p><p style="font-size:30px;line-height:1.35">She<b>’s flying</b> to Recife on Friday.</p><p style="font-size:30px;line-height:1.35">We<b>’re having</b> a meeting at 3.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">It’s in the calendar: day, time, people.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Questions</h3><p style="font-size:30px;line-height:1.35"><b>What are you doing</b> tonight?</p><p style="font-size:30px;line-height:1.35"><b>Are you doing</b> anything on Friday?</p><p style="font-size:30px;line-height:1.35"><b>When are you</b> start<b>ing</b>?</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Compare: I’m going to study more (a plan).</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Time words: tonight · tomorrow · on Friday · next week · at 8 o’clock · this weekend</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 26 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Write the arrangement</h3><p style="font-size:25px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. (I / meet / Ana / Friday) → I’m meeting Ana on Friday.</p><p style="font-size:29px;line-height:1.35">1. (we / have / a test / Monday)</p><p style="font-size:29px;line-height:1.35">2. (she / start / a new job / next week)</p><p style="font-size:29px;line-height:1.35">3. (they / not / come / tonight)</p><p style="font-size:29px;line-height:1.35">4. (you / work / Saturday?)</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Answer about you</h3><p style="font-size:29px;line-height:1.35">1. What are you doing tonight?</p><p style="font-size:29px;line-height:1.35">2. Are you working this weekend?</p><p style="font-size:29px;line-height:1.35">3. Who are you meeting this week?</p><p style="font-size:29px;line-height:1.35">4. When is your next English class?</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 26 (What are you doing tomorrow?): Exercise 26.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 26 · 5/7</p>

</section>

<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="diary" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: find a free time</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Find a free time for coffee</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Sentence Starters</h3><p style="font-size:30px;line-height:1.35">Finish the sentence fast:</p><p style="font-size:28px;line-height:1.35">“This weekend I’m…” · “Tomorrow at 8 I’m…” · “Next week my boss is…” · “On Friday night we’re…”</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Your week (student)</h3><p style="font-size:27px;line-height:1.35">Mon: working late · Tue: English class 8 pm</p><p style="font-size:27px;line-height:1.35">Wed: free after 6 · Thu: dentist 5 pm</p><p style="font-size:27px;line-height:1.35">Fri: dinner with family · Sat: free in the morning</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Are you doing anything on…? · I’m busy. I’m… · How about…?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 11 · A Busy Week · 6/7</p>

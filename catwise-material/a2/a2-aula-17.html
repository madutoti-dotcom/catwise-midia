<figure class="sl" aria-label="Slide 2 de 7"><div class="fr"><section data-id="warmup" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: talk about objects</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Look around you</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. Find 3 objects near you. What are they made of?</p><p style="font-size:36px;line-height:1.35">2. Do you have too many things at home?</p><p style="font-size:36px;line-height:1.35">3. What do you have to buy this week?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Materials</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">plastic</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">wood</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">metal</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">glass</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">cotton</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">paper</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">leather</p></div><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">My table is made of wood.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 17 · Made in… · 2/7</p>

<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="read" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">READ &amp; MATCH</p><p style="font-size:28px;color:#955E14">Goal: learn about famous inventions</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Who invented it?</h2><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:14px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:27px;line-height:1.35">The telephone <b>was invented</b> by Alexander Graham Bell. He got the patent in 1876.</p><p style="font-size:27px;line-height:1.35">The World Wide Web <b>was created</b> by Tim Berners-Lee, a British scientist, in 1989.</p><p style="font-size:27px;line-height:1.35">The first email <b>was sent</b> by Ray Tomlinson in 1971. He chose the @ symbol.</p><p style="font-size:27px;line-height:1.35">The first text message <b>was sent</b> in 1992. It said “Merry Christmas”.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Answer</h3><p style="font-size:28px;line-height:1.35">1. When was the telephone patented?</p><p style="font-size:28px;line-height:1.35">2. Who created the Web?</p><p style="font-size:28px;line-height:1.35">3. Which came first: email or the Web?</p><p style="font-size:28px;line-height:1.35">4. What did the first SMS say?</p><p style="font-size:28px;line-height:1.35">5. Which invention can’t you live without?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 17 · text written by CatWise · 3/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNIT 21</p><p style="font-size:28px;color:#955E14">Goal: focus on the object</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">It was invented by…</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Present</h3><p style="font-size:28px;line-height:1.35">Coffee <b>is grown</b> in Brazil.</p><p style="font-size:28px;line-height:1.35">These shoes <b>are made</b> in Italy.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">am / is / are + participle</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Past</h3><p style="font-size:28px;line-height:1.35">The phone <b>was invented</b> in 1876.</p><p style="font-size:28px;line-height:1.35">These photos <b>were taken</b> in Paris.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">was / were + participle</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">by…</h3><p style="font-size:28px;line-height:1.35"><b>by</b> = who did it</p><p style="font-size:28px;line-height:1.35">Dom Casmurro was written <b>by</b> Machado de Assis.</p><p style="font-size:27px;line-height:1.35">My wallet was stolen. (we don’t know who)</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Active: Bell <b>invented</b> the phone. → Passive: The phone <b>was invented by</b> Bell.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Unit 21 · 4/7</p>

</section>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Present or past passive?</h3><p style="font-size:28px;line-height:1.35">1. Rice ___ (grow) in many countries.</p><p style="font-size:28px;line-height:1.35">2. This house ___ (build) in 1950.</p><p style="font-size:28px;line-height:1.35">3. English ___ (speak) all over the world.</p><p style="font-size:28px;line-height:1.35">4. The Mona Lisa ___ (paint) by Leonardo da Vinci.</p><p style="font-size:28px;line-height:1.35">5. A lot of cars ___ (make) in São Paulo.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Make it passive</h3><p style="font-size:24px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">0. Bell invented the phone. → The phone was invented by Bell.</p><p style="font-size:28px;line-height:1.35">1. Brazil produces a lot of coffee.</p><p style="font-size:28px;line-height:1.35">2. Someone stole my bike.</p><p style="font-size:28px;line-height:1.35">3. Tarsila do Amaral painted Abaporu.</p><p style="font-size:28px;line-height:1.35">4. They clean the office every day.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 21 (is done / was done): Exercise 21.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 21 · 5/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: guess origins and inventors</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Where is it from?</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Hangman</h3><p style="font-size:29px;line-height:1.35">Guess the invention, letter by letter.</p><p style="font-size:30px;line-height:1.35">_ _ _ _ _ _ _ _ _ _ (10)</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Then: Who invented it? When?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Origin quiz</h3><p style="font-size:29px;line-height:1.35">Ask and answer:</p><p style="font-size:27px;line-height:1.35">Where is champagne made? · Where was pizza invented? · Where is tea grown? · Who was Harry Potter written by?</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I think it’s made in… / I think it was written by…</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 17 · Made in… · 6/7</p>

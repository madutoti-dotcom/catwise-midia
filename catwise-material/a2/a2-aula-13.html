<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: talk about films</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Films and series</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. Have you ever watched a film in English?</p><p style="font-size:36px;line-height:1.35">2. What’s the best film you’ve ever seen?</p><p style="font-size:36px;line-height:1.35">3. What are you watching now?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Types of film</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">action</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">comedy</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">horror</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">romantic comedy</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">sci-fi</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">animation</p><p style="font-size:27px;line-height:1.35;background:#FFCB87;padding:4px 14px">drama</p></div><p style="font-size:32px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I’ve seen it three times! It’s a comedy.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 13 · Have You Seen It? · 2/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 3 de 7"><div class="fr"><section data-id="listen" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">LISTEN &amp; ANSWER</p><p style="font-size:28px;color:#955E14">Goal: understand friends choosing a film</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Going to the cinema</h2><p style="font-size:30px;background:#1F1F1F;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglishteens.britishcouncil.org/skills/listening/a2-listening/going-cinema"><span style="color:#FBF1E1">Listen on British Council ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4A3B2A">Two friends, Mario and Tamara, choose a film. Listen and answer.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Questions</h3><p style="font-size:30px;line-height:1.35">1. Which film has Mario already seen?</p><p style="font-size:30px;line-height:1.35">2. Which film has Tamara seen?</p><p style="font-size:30px;line-height:1.35">3. Why don’t they see War Games?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:30px;line-height:1.35">4. Which film do they choose? What type is it?</p><p style="font-size:30px;line-height:1.35">5. What time does it start? When do they meet?</p><p style="font-size:28px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Find: already · yet · have you seen…?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Audio: British Council LearnEnglish Teens, “Going to the cinema” (A2) · link only · 3/7</p>

</section>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR · UNITS 16 &amp; 20</p><p style="font-size:28px;color:#955E14">Goal: choose the right tense</p></div><h2 style="font-size:54px;font-weight:400;line-height:1.1">I’ve already seen it. I saw it last week.</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">just / already</h3><p style="font-size:28px;line-height:1.35">I’ve <b>just</b> bought the tickets.</p><p style="font-size:26px;line-height:1.35">= a moment ago</p><p style="font-size:28px;line-height:1.35">She’s <b>already</b> seen it.</p><p style="font-size:26px;line-height:1.35">= before now, maybe early</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">yet (? and –)</h3><p style="font-size:28px;line-height:1.35">Have you seen it <b>yet</b>?</p><p style="font-size:28px;line-height:1.35">I haven’t seen it <b>yet</b>.</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">yet goes at the end</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Past simple = when</h3><p style="font-size:28px;line-height:1.35">I <b>saw</b> it <b>last week</b>.</p><p style="font-size:28px;line-height:1.35">We <b>went</b> <b>on Friday</b>.</p><p style="font-size:28px;line-height:1.35"><b>When did</b> you see it?</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">yesterday · ago · in 2020</p></div></div><div style="background:#FFDE59;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Never: “I have seen it yesterday” → <b>I saw it yesterday.</b></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 16 and 20 · 4/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: use the rules</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Present perfect or past simple?</h3><p style="font-size:28px;line-height:1.35">1. I ___ (see) that film last night.</p><p style="font-size:28px;line-height:1.35">2. ___ you ___ (finish) the series yet?</p><p style="font-size:28px;line-height:1.35">3. She ___ (just / buy) the popcorn.</p><p style="font-size:28px;line-height:1.35">4. We ___ (go) to the cinema two days ago.</p><p style="font-size:28px;line-height:1.35">5. I ___ (never / watch) a horror film.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. just, already or yet?</h3><p style="font-size:28px;line-height:1.35">1. The film has ___ started. Hurry!</p><p style="font-size:28px;line-height:1.35">2. I haven’t seen the new episode ___.</p><p style="font-size:28px;line-height:1.35">3. “Buy the tickets!” “I’ve ___ bought them.”</p><p style="font-size:28px;line-height:1.35">4. Have you read the book ___?</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Unit 20 (I have done / I did): Exercise 20.1. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Unit 20 · 5/7</p>

</section>
</div></figure>
<figure class="sl" aria-label="Slide 6 de 7"><div class="fr"><section data-id="odd" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: catch up with a friend</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What have you done this week?</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">1. Odd One Out</h3><p style="font-size:30px;line-height:1.35">Which word is different? Why?</p><p style="font-size:28px;line-height:1.35">seen · gone · went · eaten</p><p style="font-size:28px;line-height:1.35">yet · already · yesterday · just</p><p style="font-size:28px;line-height:1.35">comedy · horror · popcorn · drama</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">2. Catch-up call</h3><p style="font-size:29px;line-height:1.35">Call a friend. Ask: Have you… yet?</p><p style="font-size:27px;line-height:1.35">watch the new series · finish the book · buy the tickets · call Mum</p><p style="font-size:29px;line-height:1.35">Then ask: When? Did you like it?</p><p style="font-size:26px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">I’ve just… · I haven’t… yet · I did it on Monday.</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise · A2 · Aula 13 · Have You Seen It? · 6/7</p>

</section>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#3E5468">Goal: say everyday numbers</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Numbers in your day</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What time will you finish work today?</p><p style="font-size:36px;line-height:1.35">2. How many people work in your team?</p><p style="font-size:36px;line-height:1.35">3. What’s your office phone number?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Say these</h3><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">15 or 50? · 13 or 30? · 18 or 80?</p><p style="font-size:36px;line-height:1.35">fif<b>TEEN</b> · <b>FIF</b>ty</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Your teacher says one. You point to it.</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LISTEN &amp; MATCH</p><p style="font-size:28px;color:#3E5468">Goal: understand numbers in a talk</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Facts and figures</h2><p style="font-size:30px;background:#1F2933;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglish.britishcouncil.org/free-resources/listening/a2/facts-figures"><span style="color:#EEF1F4">Listen on British Council ↗</span></a></p></div><p style="font-size:30px;line-height:1.35;color:#4B5563">A short talk about the Panama Canal and world trade. Listen and match the number to the fact.</p><div style="display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Numbers</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px"><p style="font-size:32px;line-height:1.35">1. 82</p><p style="font-size:32px;line-height:1.35">4. 1914</p><p style="font-size:32px;line-height:1.35">2. 15,000</p><p style="font-size:32px;line-height:1.35">5. 40,000</p><p style="font-size:32px;line-height:1.35">3. 8 to 10</p><p style="font-size:32px;line-height:1.35">6. 99%</p></div></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Facts</h3><p style="font-size:28px;line-height:1.35">a) ships that use the canal every year</p><p style="font-size:28px;line-height:1.35">b) kilometres long</p><p style="font-size:28px;line-height:1.35">c) the year it was finished</p><p style="font-size:28px;line-height:1.35">d) hours to cross the canal</p><p style="font-size:28px;line-height:1.35">e) extra kilometres around South America</p><p style="font-size:28px;line-height:1.35">f) of ships can pass since 2016</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">Audio: British Council LearnEnglish, “Facts and figures” (A2) · link only · 3/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: say numbers clearly</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Saying numbers</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Big numbers</h3><p style="font-size:28px;line-height:1.35">1,500 = one thousand five hundred</p><p style="font-size:28px;line-height:1.35">40,000 = forty thousand</p><p style="font-size:28px;line-height:1.35">3,200,000 = three point two million</p><p style="font-size:28px;line-height:1.35;color:#4B5563">No -s: two million, five thousand</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Years and dates</h3><p style="font-size:28px;line-height:1.35">1914 = nineteen fourteen</p><p style="font-size:28px;line-height:1.35">2016 = twenty sixteen</p><p style="font-size:28px;line-height:1.35">2000 = two thousand</p><p style="font-size:28px;line-height:1.35">in 2025 · on 3 June</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Per cent and money</h3><p style="font-size:28px;line-height:1.35">99% = ninety-nine per cent</p><p style="font-size:28px;line-height:1.35">2.5 = two point five</p><p style="font-size:28px;line-height:1.35">$3m = three million dollars</p><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Sales went up 10%.</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">English: <b>15,000</b> (comma) and <b>2.5</b> (point) · Portuguese: 15.000 and 2,5</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise · A2 Business · Aula 8 · Facts and Figures · 4/7</p>

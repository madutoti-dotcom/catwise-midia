<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#3E5468">Goal: share news from your workplace</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">What’s new at work?</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tell me</h3><p style="font-size:36px;line-height:1.35">1. What is changing at your company this month?</p><p style="font-size:36px;line-height:1.35">2. Do you have team meetings? When?</p><p style="font-size:36px;line-height:1.35">3. Who gives the news?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Example</h3><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">We’re moving to a new office in June.</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">We have a team meeting on Mondays at 9.</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Subject line game: say a subject for an email about this news.</p></div></div>

;padding:4px 14px;align-self:flex-start">What are the three topics?</p></div></div>

x;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">will + verb = future fact · have to = it’s necessary · can = it’s possible</p></div>

nday) → The new manager will start on Monday.</p><p style="font-size:30px;line-height:1.35">1. (the lift / be closed / next week)</p><p style="font-size:30px;line-height:1.35">2. (we / move / to the 3rd floor / in July)</p><p style="font-size:30px;line-height:1.35">3. (everyone / have to / change / password)</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 6 “Meetings”: the dialogue. Your teacher shows the PDF.</p></div>

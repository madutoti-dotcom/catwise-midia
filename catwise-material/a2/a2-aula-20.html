<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">WARM-UP</p><p style="font-size:28px;color:#955E14">Goal: answer fast</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Speed Questions</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Answer in one sentence</h3><p style="font-size:28px;line-height:1.35">1. What are you doing this weekend?</p><p style="font-size:28px;line-height:1.35">2. Have you ever been to another country?</p><p style="font-size:28px;line-height:1.35">3. What should I do to learn English faster?</p><p style="font-size:28px;line-height:1.35">4. Who cooks better: you or your mother?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:28px;line-height:1.35">5. Have you watched a film this week yet?</p><p style="font-size:28px;line-height:1.35">6. Where is your phone made?</p><p style="font-size:28px;line-height:1.35">7. What do you have to do tomorrow?</p><p style="font-size:28px;line-height:1.35">8. Do you enjoy cooking?</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GAME</p><p style="font-size:28px;color:#955E14">Goal: ask real questions</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Find someone who…</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Ask your teacher (and people at home!)</h3><p style="font-size:28px;line-height:1.35">…has never eaten sushi.</p><p style="font-size:28px;line-height:1.35">…is meeting a friend this week.</p><p style="font-size:28px;line-height:1.35">…has to get up before 6.</p><p style="font-size:28px;line-height:1.35">…speaks English better than you.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:28px;line-height:1.35">…has just finished a series.</p><p style="font-size:28px;line-height:1.35">…enjoys running.</p><p style="font-size:28px;line-height:1.35">…thinks cities are better than the country.</p><p style="font-size:28px;line-height:1.35">…has something made in Italy.</p><p style="font-size:25px;line-height:1.35;background:#FFDE59;padding:4px 14px;align-self:flex-start">Have you ever…? · Are you… this week? · Do you have to…?</p></div></div>

<figure class="sl" aria-label="Slide 4 de 7"><div class="fr"><section data-id="language" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">GRAMMAR MAP</p><p style="font-size:28px;color:#955E14">Goal: choose the right form</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Which form?</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Experience / no time</h3><p style="font-size:28px;line-height:1.35">present perfect</p><p style="font-size:27px;line-height:1.35">I’ve <b>never been</b> to Peru.</p><p style="font-size:27px;line-height:1.35">I’ve <b>just</b> finished.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Arrangement</h3><p style="font-size:28px;line-height:1.35">present continuous</p><p style="font-size:27px;line-height:1.35">I’m <b>meeting</b> Ana on Friday.</p><p style="font-size:27px;line-height:1.35">Are you <b>working</b> tomorrow?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Advice / rules</h3><p style="font-size:28px;line-height:1.35">should · must · have to</p><p style="font-size:27px;line-height:1.35">You <b>should</b> rest.</p><p style="font-size:27px;line-height:1.35">You <b>mustn’t</b> smoke here.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Who did it? / where?</h3><p style="font-size:28px;line-height:1.35">passive</p><p style="font-size:27px;line-height:1.35">It <b>was written by</b>…</p><p style="font-size:27px;line-height:1.35">Coffee <b>is grown</b> in…</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">How?</h3><p style="font-size:28px;line-height:1.35">adverbs</p><p style="font-size:27px;line-height:1.35">She drives <b>carefully</b>.</p><p style="font-size:27px;line-height:1.35">He plays <b>better</b> than me.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:8px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Opinions</h3><p style="font-size:28px;line-height:1.35">-ing / to · I think</p><p style="font-size:27px;line-height:1.35">I <b>enjoy reading</b>.</p><p style="font-size:27px;line-height:1.35"><b>Would you like to</b> come?</p></div></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 16–17, 20–21, 26, 32–34 · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#FBF1E1;color:#1F1F1F;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#955E14">Goal: choose the right form</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Mixed practice</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">A. Choose</h3><p style="font-size:27px;line-height:1.35">1. I (saw / have seen) that film last week.</p><p style="font-size:27px;line-height:1.35">2. You (mustn’t / don’t have to) pay. It’s free.</p><p style="font-size:27px;line-height:1.35">3. She sings very (good / well).</p><p style="font-size:27px;line-height:1.35">4. The bridge (built / was built) in 1974.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">B. Complete</h3><p style="font-size:27px;line-height:1.35">1. I ___ (meet) my boss at 3 tomorrow.</p><p style="font-size:27px;line-height:1.35">2. Have you finished it ___? (yet / already)</p><p style="font-size:27px;line-height:1.35">3. I enjoy ___ (walk) in the park.</p><p style="font-size:27px;line-height:1.35">4. There are ___ cars in this city. (too much / too many)</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFCB87;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Essential Grammar in Use · Additional exercises (end of the book): choose the exercises on the present perfect and the passive. Confira os números no livro.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#955E14">CatWise exercises · EXTRA: Essential Grammar in Use, Additional exercises · 5/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#955E14;color:#FBF1E1;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#955E14">Goal: solve real situations</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Role cards</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#955E14;line-height:1.2">Choose 3 cards</h3><p style="font-size:26px;line-height:1.35">🎬 Invite your teacher to a film. She is busy on Friday.</p><p style="font-size:26px;line-height:1.35">🩺 You’re a doctor. Your patient has a headache.</p><p style="font-size:26px;line-height:1.35">🗺️ A tourist asks for directions to the station.</p><p style="font-size:26px;line-height:1.35">♻️ You’re the mayor. Explain 3 new rules.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:12px;background:#FFF8EC;border:2px solid #DCC6A0;border-radius:16px;padding:28px 34px"><p style="font-size:26px;line-height:1.35">🎁 Show a special object: where was it made?</p><p style="font-size:26px;line-height:1.35">📞 Call a friend: have you done the homework yet?</p><p style="font-size:26px;line-height:1.35">⚽ Compare 2 athletes: who plays better?</p><p style="font-size:28px;line-height:1.35;color:#4A3B2A">Each card: 2 minutes. Then change roles.</p></div></div>

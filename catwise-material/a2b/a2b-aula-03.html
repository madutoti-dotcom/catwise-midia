ler.</p><p style="font-size:28px;line-height:1.35">A: Nice to meet you ______. Please ______ me Peter.</p><p style="font-size:28px;line-height:1.35">B: Here’s my ______. Could you ______ your surname?</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">British Council, “Business cards”: Task 1 (true or false) and Task 2 (matching) online.</p></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">WATCH &amp; ANSWER</p><p style="font-size:28px;color:#3E5468">Goal: notice how people say sorry</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Apologising</h2><p style="font-size:30px;background:#1F2933;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://learnenglish.britishcouncil.org/free-resources/speaking/a2/apologising"><span style="color:#EEF1F4">Watch on British Council ↗</span></a></p></div><p style="font-size:32px;line-height:1.35;color:#4B5563">Paul and Noelia have a small accident at work. Watch and answer.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Questions</h3><p style="font-size:30px;line-height:1.35">1. What happened to Noelia?</p><p style="font-size:30px;line-height:1.35">2. Why did it happen? (two reasons)</p><p style="font-size:30px;line-height:1.35">3. What did Noelia save?</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:10px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Tick the phrases you hear</h3><p style="font-size:30px;line-height:1.35">□ I’m so sorry!</p><p style="font-size:30px;line-height:1.35">□ It was my fault.</p><p style="font-size:30px;line-height:1.35">□ I apologise for the delay.</p><p style="font-size:30px;line-height:1.35">□ Don’t worry about it.</p><p style="font-size:30px;line-height:1.35">□ Honestly, it’s fine.</p></div></div>

tyle="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">Answer: That’s all right. · Don’t worry about it. · Thank you for your help.</p></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: use the language</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. Match problem and solution</h3><p style="font-size:28px;line-height:1.35">1. The invoice is wrong.</p><p style="font-size:28px;line-height:1.35">2. The projector doesn’t work.</p><p style="font-size:28px;line-height:1.35">3. The package didn’t arrive.</p><p style="font-size:28px;line-height:1.35">4. I can’t open the file.</p><p style="font-size:26px;line-height:1.35;color:#4B5563">a) I’ll send it again as a PDF. · b) I’ll check with the driver. · c) I’ll send a new one today. · d) I’ll call IT.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Complete the call</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">afraid</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">sorry</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">I’ll</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">apologise</p><p style="font-size:26px;line-height:1.35;background:#FFE1BA;padding:4px 14px">should</p></div><p style="font-size:28px;line-height:1.35">A: I’m ______ there’s a problem with my order.</p><p style="font-size:28px;line-height:1.35">B: Oh, I’m so ______ about that. What happened?</p><p style="font-size:28px;line-height:1.35">A: Only 8 boxes arrived, not 10.</p><p style="font-size:28px;line-height:1.35">B: I ______ for the mistake. ______ send 2 boxes today. They ______ arrive tomorrow.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 9 “Business problems and solutions”: the dialogue. Your teacher shows the PDF.</p></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#3E5468">Goal: solve a client’s problem on the phone</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Role-play: a client calls</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Client (teacher first)</h3><p style="font-size:30px;line-height:1.35">• Your delivery is 3 days late.</p><p style="font-size:30px;line-height:1.35">• The invoice has the wrong price.</p><p style="font-size:30px;line-height:1.35">• You got the wrong product.</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Choose one. You are not happy.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">You answer</h3><p style="font-size:30px;line-height:1.35">1. Listen and repeat the problem.</p><p style="font-size:30px;line-height:1.35">2. Say sorry.</p><p style="font-size:30px;line-height:1.35">3. Offer a solution with <b>I’ll</b> and a time.</p><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">I’ll send it today. It should arrive by Friday.</p></div></div>

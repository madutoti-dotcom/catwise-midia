height:1.35;background:#FFE1BA;padding:4px 14px">manager</p><p style="font-size:30px;line-height:1.35;background:#FFE1BA;padding:4px 14px">designer</p></div></div></div>

color:#3E5468;line-height:1.2">Then answer</h3><p style="font-size:36px;line-height:1.35">5. Who will Yuki work closely with?</p><p style="font-size:36px;line-height:1.35">6. Who can help Yuki with email on the phone?</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Answer like this: “I think it’s c, because…”</p></div></div>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">LANGUAGE</p><p style="font-size:28px;color:#3E5468">Goal: say what you do and ask about jobs</p></div><h2 style="font-size:64px;font-weight:400;line-height:1.1">Talking about your job</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">for · in · as</h3><p style="font-size:34px;line-height:1.35">I work <b>for</b> Natura.</p><p style="font-size:34px;line-height:1.35">I work <b>in</b> marketing.</p><p style="font-size:34px;line-height:1.35">I work <b>as</b> a designer.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">What you do</h3><p style="font-size:34px;line-height:1.35">I’m <b>responsible for</b> sales.</p><p style="font-size:34px;line-height:1.35">I <b>deal with</b> clients.</p><p style="font-size:34px;line-height:1.35">I <b>take care of</b> orders.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">Questions</h3><p style="font-size:34px;line-height:1.35">What <b>do</b> you <b>do</b>?</p><p style="font-size:34px;line-height:1.35">What <b>does</b> she <b>do</b>?</p><p style="font-size:32px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">She work<b>s</b> in IT.</p></div></div><div style="background:#D9E4EE;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:30px;line-height:1.35">for + company · in + department · as + job title · he / she / it + <span style="color:#3E5468">-s</span></p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">Based on Essential Grammar in Use (R. Murphy, Cambridge), Units 5–7 (present simple) · 4/7</p>

<figure class="sl" aria-label="Slide 5 de 7"><div class="fr"><section data-id="practice" style="background:#EEF1F4;color:#1F2933;font-family:'Cal Sans', Arial, sans-serif;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;align-items:flex-start">
<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">PRACTICE</p><p style="font-size:28px;color:#3E5468">Goal: use the language</p></div><h2 style="font-size:58px;font-weight:400;line-height:1.1">Your turn</h2><div style="display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">A. for, in or as?</h3><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">0. I work ___ a bank. → for</p><p style="font-size:32px;line-height:1.35">1. Ana works ___ human resources.</p><p style="font-size:32px;line-height:1.35">2. He works ___ a sales manager.</p><p style="font-size:32px;line-height:1.35">3. They work ___ Petrobras.</p><p style="font-size:32px;line-height:1.35">4. I work ___ the finance department.</p><p style="font-size:32px;line-height:1.35">5. She works ___ an engineer.</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">B. Make the question</h3><p style="font-size:28px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">0. (you / do?) → What do you do?</p><p style="font-size:32px;line-height:1.35">1. (she / work for?)</p><p style="font-size:32px;line-height:1.35">2. (he / responsible for?)</p><p style="font-size:32px;line-height:1.35">3. (you / deal with clients?)</p><p style="font-size:32px;line-height:1.35">4. (they / work in?)</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Then answer with real information.</p></div></div><div style="display:flex;gap:20px;align-items:center;background:#FFE1BA;border-radius:12px;padding:14px 28px;align-self:stretch"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:4px 14px">EXTRA</p><p style="font-size:28px;line-height:1.3">Business book (Materiais ESL), Unit 3 “Office Conversation”, Writing: fill in the blanks. In class if we have time, or at home.</p></div>
<p style="position:absolute;left:112px;bottom:48px;width:1696px;font-size:24px;color:#3E5468">CatWise exercises · EXTRA: Business book (Materiais ESL), Unit 3 · 5/7</p>

<div style="display:flex;gap:20px;align-items:center"><p style="font-size:26px;background:#3E5468;color:#EEF1F4;padding:6px 18px;letter-spacing:2px">SPEAKING</p><p style="font-size:28px;color:#3E5468">Goal: meet a new colleague</p></div><div style="display:flex;gap:32px;align-items:center;align-self:stretch"><h2 style="font-size:64px;font-weight:400;line-height:1.1;flex:1">Role-play: first day at the office</h2><p style="font-size:30px;background:#1F2933;padding:14px 28px;border-radius:999px;align-self:flex-start"><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/15f7vwP92HtYvEIFAJuJZCa5ZLuDUXL50/view"><span style="color:#EEF1F4">Open the book, Unit 3 ↗</span></a></p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-self:stretch;flex:1;max-height:600px"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">1. Listen to the model</h3><p style="font-size:36px;line-height:1.35">Brian meets Andrew, a new colleague. Listen and answer:</p><p style="font-size:36px;line-height:1.35">Which department is Andrew in?</p><p style="font-size:36px;line-height:1.35">Which floor does Brian work on?</p><p style="font-size:28px;line-height:1.35;color:#4B5563">Useful: Are you new here? · Nice to meet you · I work on the 5th floor · See you around</p></div><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#F8FAFC;border:2px solid #C9D2DC;border-radius:16px;padding:28px 34px"><h3 style="font-size:36px;font-weight:400;color:#3E5468;line-height:1.2">2. Your turn</h3><p style="font-size:36px;line-height:1.35"><b>A:</b> You are new. Say your name, job and department.</p><p style="font-size:36px;line-height:1.35"><b>B:</b> You work here. Welcome A, say what you do, give 1 tip about the office.</p><p style="font-size:30px;line-height:1.35;background:#D9E4EE;padding:4px 14px;align-self:flex-start">Change roles. Then: describe 2 real colleagues.</p></div></div>
